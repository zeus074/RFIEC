# Builds the RFIEC desktop app for Windows, Linux and macOS.
# - on every push that touches desktop/: builds and keeps the packages as workflow artifacts
# - on a tag "desktop-v*": also attaches the packages to the GitHub release of that tag
name: Desktop app

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build packages
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: RFIEC-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
          if-no-files-found: error

  # one job creates the release and attaches the packages of all three systems
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Version from the tag
        run: echo "VER=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v3
        with:
          name: RFIEC desktop ${{ env.VER }} (beta)
          body_path: desktop/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          files: packages/*
