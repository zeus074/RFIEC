<style>
@font-face{font-family:'Inter';src:url(fonts/Inter.ttf) format('truetype');font-weight:100 900}
@font-face{font-family:'Press Start 2P';src:url(fonts/PressStart2P.ttf) format('truetype')}
@font-face{font-family:'VT323';src:url(fonts/VT323.ttf) format('truetype')}
html,body{margin:0;background:#0f0c24}
.rffl{min-height:100vh;box-sizing:border-box}
.rffl .head h2,.rffl .head>p{display:none}
.rffl{padding-top:12px!important}
.rffl .head .stats{margin-top:0}
.rffl{--bg:#0f0c24;--bg2:#171338;--panel:#1d1846;--line:#342c74;--text:#eceaff;--muted:#aaa5d8;--c64l:#7c70da;--c64b:#40318d;--mag:#e0398a;--yel:#ffd23f;--grn:#5ad15f;--cya:#3fd8ff;--red:#f94144;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:var(--bg);line-height:1.55;padding:36px 0 28px}
.rffl *,.rffl *::before,.rffl *::after{box-sizing:border-box}
.rffl h2,.rffl h3,.rffl h4,.rffl p,.rffl ul,.rffl ol{margin:0;padding:0}
.rffl h2,.rffl h3,.rffl h4{font-family:'Inter',system-ui,sans-serif!important;letter-spacing:0;text-transform:none;font-weight:700;color:var(--text)}
.rffl a{color:var(--cya)}
.rffl button,.rffl input,.rffl select{font:inherit;color:inherit}
.rffl button{cursor:pointer}
.rffl button:disabled{cursor:not-allowed;opacity:.45}
.rffl [hidden]{display:none!important}
.rffl .wrap{max-width:1400px;margin:0 auto;padding:0 16px}
.rffl .head h2{font-family:'Press Start 2P',monospace!important;font-size:clamp(17px,3vw,27px);line-height:1.45;color:var(--yel);margin-bottom:12px}
.rffl .head p{color:var(--muted);max-width:900px;font-size:16px}
.rffl .head .stats{font-family:'VT323',monospace;font-size:19px;color:var(--c64l);margin-top:8px}
.rffl .head .stats b{color:var(--grn);font-weight:400}
.rffl .head .stats i{color:var(--red);font-style:normal}

/* pulsanti */
.rffl .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:7px 12px;font-size:14px;line-height:1.3;white-space:nowrap}
.rffl .btn:hover:not(:disabled){background:var(--line);color:#fff}
.rffl .btn.pri{background:var(--grn);border-color:var(--grn);color:#0f0c24;font-weight:700}
.rffl .btn.pri:hover:not(:disabled){background:#7be27f;color:#0f0c24}
.rffl .btn.rf{background:#ff8a1f;border-color:#ff8a1f;color:#1d1000;font-weight:700}
.rffl .btn.rf:hover:not(:disabled){background:#ffa552;border-color:#ffa552;color:#1d1000}
.rffl .btn.rf .onl{display:none}
.rffl .btn.rf.on{background:#ffe0bf;border-color:#ffb36b;color:#5a2e00;opacity:1;cursor:default}
.rffl .btn.rf.on .onl{display:inline}.rffl .btn.rf.on .offl{display:none}
.rffl .btn.warn{border-color:var(--mag);color:#ff9ccc}
.rffl .btn.warn:hover:not(:disabled){background:var(--mag);color:#fff}
.rffl .btn.sm{padding:4px 9px;font-size:13px;border-radius:6px}
.rffl .btn .i{font-size:15px;line-height:1}
.rffl input[type=text],.rffl input[type=search],.rffl select{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:14px;outline:none}
.rffl input[type=text]:focus,.rffl input[type=search]:focus,.rffl select:focus{border-color:var(--c64l)}
.rffl select option{background:var(--bg2)}
.rffl label.ck{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);cursor:pointer}
.rffl label.ck input{accent-color:var(--grn);width:16px;height:16px}

/* collegamento */
.rffl .conn{margin:22px 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.rffl .modes{display:flex;border-bottom:1px solid var(--line);background:#2a2a31;border-radius:10px 10px 0 0;overflow:hidden}
.rffl .modes button{flex:1;background:#2a2a31;border:0;border-right:1px solid #3d3d47;border-bottom:3px solid transparent;cursor:pointer;transition:background .15s;padding:12px 10px 10px;font-size:15px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.rffl .modes button:last-child{border-right:0}
.rffl .modes button small{font-weight:400;font-size:12.5px;color:#a9a9b6}
.rffl .modes button{color:#cfcfd8}
.rffl .modes button[aria-selected=true]{color:#fff;border-bottom-color:var(--yel);background:var(--panel)}
.rffl .modes button[aria-selected=true] small{color:#d6d2ff}
.rffl .modes button .ico{font-style:normal;font-size:13px;font-weight:700;letter-spacing:.5px;color:#a9a9b6;opacity:.75;margin-bottom:2px;white-space:nowrap}
.rffl .modes button[aria-selected=true] .ico{opacity:1;color:#fff}
.rffl .modes button:not([aria-selected=true]):hover{color:#fff;background:#383842}
.rffl .cbody{padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.rffl .cbody .note{flex:1 1 100%;font-size:14px;color:var(--muted)}
.rffl .cbody .note b{color:var(--text)}
.rffl .cbody .note.err{color:#ffb3b4}
.rffl .fld{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted)}
.rffl details.help{flex:1 1 100%;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.rffl details.help summary{cursor:pointer;color:var(--cya);font-weight:600}
.rffl details.help ul{margin:8px 0 0 18px}
.rffl details.help li{margin:3px 0}
.rffl details.help code,.rffl .cbody code,.rffl .credits code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--bg2);padding:0 4px;border-radius:3px;color:var(--yel)}
.rffl .devrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--bg2);border-radius:0 0 10px 10px}
/* frontalino del drive con i due LED, come un 1541 vero */
.rffl .mini1541{position:relative;width:96px;height:38px;flex:none;background:linear-gradient(#ebe4cd,#d2c9ab 70%,#bfb593);border:1px solid #8f866c;border-radius:4px 4px 5px 5px;box-shadow:inset 0 1px 0 #faf6e8,0 3px 6px #0008}
.rffl .mini1541::before{content:'';position:absolute;left:6px;right:6px;top:4px;height:3px;background:repeating-linear-gradient(90deg,#b8ae8c 0 4px,transparent 4px 7px);opacity:.8}
.rffl .mini1541 .slot{position:absolute;left:7px;right:7px;top:11px;height:9px;background:#151312;border-radius:2px;box-shadow:inset 0 2px 3px #000,0 1px 0 #f3eddb}
.rffl .mini1541 .pwr,.rffl .mini1541 .led{position:absolute;bottom:6px;width:12px;height:5px;border-radius:1px;border:1px solid #5d5645;box-shadow:inset 0 1px 1px #0008}
.rffl .mini1541 .pwr{left:9px;bottom:5px;width:8px;height:8px;border-radius:50%;background:#24401f}
.rffl .mini1541 .led{left:22px;width:14px;background:#4a1d1a}
.rffl .mini1541 .pwr.on{background:#6cf06a;box-shadow:0 0 6px #5ad15f,0 0 1px #fff inset}
.rffl .mini1541 .led.on{background:#ff3b30;box-shadow:0 0 7px #f94144,0 0 1px #fff inset}
.rffl .mini1541 .led.err{animation:rfflerr .5s steps(1) infinite}
@keyframes rfflerr{0%{background:#ff3b30;box-shadow:0 0 7px #f94144}50%{background:#4a1d1a;box-shadow:none}}
.rffl .led{width:14px;height:14px;border-radius:50%;background:#3a1416;border:1px solid #000;box-shadow:inset 0 0 3px #000;flex:none}
.rffl .led.on{background:var(--red);box-shadow:0 0 8px var(--red),0 0 2px #fff inset}
.rffl .pwr{width:14px;height:14px;border-radius:3px;background:#173a19;border:1px solid #000;flex:none}
.rffl .pwr.on{background:var(--grn);box-shadow:0 0 7px var(--grn)}
.rffl .dstat{font-family:'VT323',monospace;font-size:20px;color:var(--c64l);min-width:0;overflow-wrap:anywhere}
.rffl .dstat.err{color:var(--red)}
.rffl .dstat.ok{color:var(--grn)}
.rffl .devrow .sp{flex:1}

/* layout */
.rffl .main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.rffl .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;position:relative}
.rffl .phead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.rffl .phead h3{font-size:17px!important;color:var(--yel)!important}
.rffl .phead .sub{font-size:13.5px;color:var(--muted)}
.rffl .tools{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
.rffl .tools .sep{flex:1}
.rffl .pbody{padding:0 14px 14px}

/* indicatore drive reale / simulazione */
.rffl .mflag{margin:10px 14px 0;border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.45;border:1px solid var(--line);background:var(--bg2);color:var(--muted)}
.rffl .mflag b{font-family:'VT323',monospace;font-size:21px;font-weight:400;margin-right:6px;letter-spacing:.03em}
.rffl .mflag .btn{margin-left:6px;vertical-align:middle}
.rffl .mflag.on{border-color:var(--grn);background:#12301f;color:#c9f5cb}
.rffl .mflag.on b{color:var(--grn)}
.rffl .mflag.off{border-color:#5a5390}
.rffl .mflag.off b{color:#ff8c8e}
.rffl .mflag.sim{border:1px dashed var(--mag);background:repeating-linear-gradient(135deg,#2a1438 0 14px,#24113a 14px 28px);color:#ffd0e6}
.rffl .mflag.sim b{color:var(--yel)}
.rffl .mflag.emu{border-color:var(--cya);background:#10283e;color:#cdeeff}
.rffl .mflag.emu b{color:var(--cya)}
.rffl .mflag .eprog{display:flex;align-items:center;gap:10px;margin-top:4px;font-family:'VT323',monospace;font-size:18px;color:#cdeeff}
.rffl .mflag .eprog .bar{flex:0 0 160px;height:10px;border:1px solid var(--cya);background:#0a1a29;border-radius:2px;overflow:hidden}
.rffl .mflag .eprog .bar i{display:block;height:100%;background:var(--cya);transition:width .25s linear}
.rffl .mflag .last{display:block;font-family:'VT323',monospace;font-size:19px;color:var(--yel);margin-top:3px;overflow-wrap:anywhere}
.rffl .panel[data-mode=emu]{border-color:var(--cya);box-shadow:0 0 0 1px #1f5a7a inset}
.rffl .modes button[data-m=emu][aria-selected=true]{border-bottom-color:var(--cya)}
.rffl .log .k-c64{color:#ff9ccc}
.rffl .panel[data-mode=on]{border-color:var(--grn);box-shadow:0 0 0 1px #2c6a34 inset}
.rffl .panel[data-mode=sim]{border-style:dashed;border-color:var(--mag)}
.rffl .modes button[data-m=usb][aria-selected=true]{border-bottom-color:var(--grn)}
.rffl .modes button[data-m=sim][aria-selected=true]{border-bottom-color:var(--mag)}

/* avanzamento */
.rffl .prog{margin:0 14px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.rffl .prog .top{display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:6px}
.rffl .prog .top span{flex:1;min-width:0}
.rffl .prog .bar{height:10px;background:#0b0920;border-radius:5px;overflow:hidden}
.rffl .prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c64l),var(--cya));transition:width .2s}
.rffl .prog .bar.ind i{width:30%!important;animation:rfflind 1.2s linear infinite}
@keyframes rfflind{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.rffl .prog .eta{font-family:'VT323',monospace;font-size:18px;color:var(--c64l);margin-top:4px}

/* schermo C64 */
.rffl .scr{background:var(--c64b);border:12px solid var(--c64l);border-radius:6px;padding:8px 0;font-family:'VT323',monospace;font-size:21px;line-height:1.05;color:#a8a0ff;min-height:180px;max-height:560px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--c64l) var(--c64b)}
.rffl .scr .ln{display:flex;align-items:center;gap:8px;padding:1px 10px;white-space:pre;min-height:24px}
.rffl .scr .ln .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rffl .scr .hdr .tx span{background:#a8a0ff;color:var(--c64b)}
.rffl .scr .row{cursor:pointer;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit}
.rffl .scr .row:hover,.rffl .scr .row:focus-visible{background:#5546a8;outline:none}
.rffl .scr .row.sel{background:#a8a0ff;color:var(--c64b)}
.rffl .scr .row .acts{display:none;gap:4px;flex:none}
.rffl .scr .row:hover .acts,.rffl .scr .row.sel .acts,.rffl .scr .row:focus-within .acts{display:flex}
.rffl .scr .acts span{font-family:'Inter',system-ui,sans-serif;font-size:12.5px;line-height:1.2;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.rffl .scr .acts span:hover{background:var(--yel);color:#1a1440;border-color:var(--yel)}
.rffl .scr .acts span.del:hover{background:var(--red);color:#fff;border-color:var(--red)}
.rffl .scr .empty{padding:10px;color:#a8a0ff;white-space:normal}
.rffl .scr .cur{display:inline-block;width:.55em;height:.9em;background:#a8a0ff;vertical-align:-2px;animation:rfflblink 1s steps(1) infinite}
@keyframes rfflblink{50%{opacity:0}}
.rffl .drophint{margin-top:10px;border:2px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--muted);text-align:center}
.rffl .panel.over{outline:3px solid var(--yel);outline-offset:-3px}
.rffl .panel.over .drophint{border-color:var(--yel);color:var(--yel)}

/* schede del pannello PC */
.rffl .tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:#2a2a31;border-radius:10px 10px 0 0}
.rffl .tabs button{flex:1 0 auto;background:#2a2a31;border:0;border-right:1px solid #3d3d47;border-bottom:3px solid transparent;padding:12px 12px 9px;font-size:14px;font-weight:600;color:#cfcfd8;cursor:pointer;transition:background .15s}
.rffl .tabs button:last-child{border-right:0}
.rffl .tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--yel);background:var(--panel)}
.rffl .tabs button:not([aria-selected=true]):hover{color:#fff;background:#383842}
.rffl .tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--line);font-size:11.5px;color:var(--text)}
.rffl .pane{padding:14px}
.rffl .drop{border:2px dashed var(--line);border-radius:10px;padding:18px 14px;text-align:center;color:var(--muted);font-size:14.5px;transition:border-color .15s,background .15s}
.rffl .drop.over{border-color:var(--yel);background:#2a2366;color:#fff}
.rffl .drop .big{font-size:16px;color:var(--text);font-weight:600;margin-bottom:4px}
.rffl .drop .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.rffl .flist{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.rffl .fitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rffl .fitem .ty{font-family:'VT323',monospace;font-size:18px;color:#1a1440;background:var(--c64l);border-radius:4px;padding:0 6px;text-align:center;min-width:44px}
.rffl .fitem .ty.img{background:var(--yel)}
.rffl .fitem .ty.seq{background:var(--cya)}
.rffl .fitem .nm{min-width:0}
.rffl .fitem .nm b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rffl .fitem .nm small{font-size:12.5px;color:var(--muted)}
.rffl .fitem .c64{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.rffl .fitem .c64 input{font-family:'VT323',monospace;font-size:18px;padding:2px 8px;width:15em;max-width:100%;text-transform:uppercase}
.rffl .fitem .c64 select{padding:3px 6px;font-size:13px}
.rffl .fitem .fa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rffl .listbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:13.5px;color:var(--muted)}
.rffl .listbar .sp{flex:1}
.rffl .none{color:var(--muted);padding:14px 4px;font-size:14.5px}

/* visualizzatore immagine */
.rffl .vhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:10px}
.rffl .vhead b{font-size:15px}
.rffl .vhead span{font-size:13.5px;color:var(--muted)}
.rffl .vtools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rffl .bam{margin-top:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px}
.rffl .bam h4{font-size:13px!important;font-weight:600;color:var(--muted);text-transform:uppercase!important;letter-spacing:.06em!important;margin-bottom:8px}
.rffl .bam canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:crosshair}
.rffl .bam .leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.rffl .bam .leg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rffl .bam .tip{font-family:'VT323',monospace;font-size:18px;color:var(--cya);min-height:22px;margin-top:4px}
.rffl .detail{margin-top:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px}
.rffl .detail .dh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:8px}
.rffl .detail .dh b{font-family:'VT323',monospace;font-size:22px;color:var(--yel);font-weight:400}
.rffl .detail .dh span{font-size:13.5px;color:var(--muted)}
.rffl .detail .dh .sp{flex:1}
.rffl .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rffl .seg button{background:var(--bg2);border:0;padding:5px 11px;font-size:13px;color:var(--muted)}
.rffl .seg button+button{border-left:1px solid var(--line)}
.rffl .seg button[aria-pressed=true]{background:var(--line);color:#fff}
.rffl pre.code{font-family:'VT323',monospace;font-size:19px;line-height:1.15;background:var(--c64b);color:#a8a0ff;border:1px solid #6c5eb5;border-radius:6px;padding:10px 12px;margin:8px 0 0;max-height:420px;overflow:auto;white-space:pre;scrollbar-width:thin}
.rffl pre.hex{font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:12.5px;line-height:1.45;background:#0b0920;color:#cfcbef;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0 0;max-height:420px;overflow:auto;white-space:pre}
.rffl pre.hex i{color:var(--c64l);font-style:normal}
.rffl pre.hex u{color:var(--muted);text-decoration:none}

/* CSDb */
.rffl .csform{display:flex;gap:8px}
.rffl .csform input{flex:1;min-width:0}
.rffl .csnote{font-size:13px;color:var(--muted);margin-top:8px}
.rffl .csres{margin-top:12px;display:flex;flex-direction:column}
.rffl .csres button.hit{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 6px}
.rffl .csres button.hit:hover{background:#231d55}
.rffl .csres .hit b{font-weight:600;font-size:14.5px}
.rffl .csres .hit span{font-size:13px;color:var(--muted)}
.rffl .csres .hit em{font-style:normal;font-family:'VT323',monospace;font-size:18px;color:var(--c64l);margin-left:auto}
.rffl .rel{margin-top:12px;display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px}
.rffl .rel img{width:160px;height:auto;border-radius:4px;background:#000;image-rendering:pixelated}
.rffl .rel h4{font-size:16px!important;color:var(--yel)!important;margin-bottom:4px}
.rffl .rel .meta{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.rffl .rel .dls{display:flex;flex-direction:column;gap:6px}
.rffl .rel .dl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px}
.rffl .rel .dl code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere;color:var(--text)}
.rffl .rel .dl small{color:var(--muted)}

/* registro */
.rffl .logbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.rffl .logbar .sp{flex:1}
.rffl .log{font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:12.5px;line-height:1.5;background:#0b0920;border:1px solid var(--line);border-radius:6px;padding:8px 10px;height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.rffl .log div{color:#cfcbef}
.rffl .log .t{color:var(--muted)}
.rffl .log .k-usb{color:#8a84b8}
.rffl .log .k-bus{color:var(--c64l)}
.rffl .log .k-cmd{color:var(--yel)}
.rffl .log .k-st{color:var(--grn)}
.rffl .log .k-err{color:var(--red)}
.rffl .log .k-info{color:var(--cya)}
.rffl .log.nobus .k-bus,.rffl .log.nobus .k-usb{display:none}

.rffl .credits{margin-top:18px;font-size:13px;color:var(--muted);max-width:1100px}
.rffl .credits p+p{margin-top:6px}

/* finestre di dialogo */
.rffl dialog.dlg{background:var(--panel);color:var(--text);border:1px solid var(--c64l);border-radius:12px;padding:0;width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px #000}
.rffl dialog.dlg::backdrop{background:rgb(5 4 15 / .8)}
.rffl .dlg form{padding:18px 18px 16px}
.rffl .dlg h3{font-size:18px!important;color:var(--yel)!important;margin-bottom:10px}
.rffl .dlg .body{font-size:14.5px;color:#dcd9f7}
.rffl .dlg .body p+p{margin-top:8px}
.rffl .dlg .body .warn{color:#ff9ccc}
.rffl .dlg .fields{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.rffl .dlg .fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.rffl .dlg .fields label.ck{flex-direction:row}
.rffl .dlg .fields input[type=text]{font-family:'VT323',monospace;font-size:20px;padding:4px 10px;text-transform:uppercase}
.rffl .dlg .fields input.free{text-transform:none}
.rffl .dlg .btns{display:flex;flex-direction:row-reverse;flex-wrap:wrap-reverse;gap:8px;justify-content:flex-start;margin-top:16px}
.rffl .dlg .out{font-family:'VT323',monospace;font-size:20px;color:var(--grn);margin-top:10px;min-height:24px}
.rffl .dlg .out.err{color:var(--red)}
.rffl .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99999;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--grn);border-radius:8px;padding:10px 14px;font-size:14px;box-shadow:0 8px 30px #000;max-width:calc(100vw - 32px)}
.rffl .toast.err{border-left-color:var(--red)}

@media (max-width:1050px){.rffl .main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){
 .rffl .modes button{font-size:14px}
 .rffl .scr{font-size:18px;border-width:8px}
 .rffl .scr .acts{display:flex!important}
 .rffl .scr .row:not(.sel) .acts{display:none!important}
 .rffl .scr .row.sel{flex-wrap:wrap}
 .rffl .scr .row.sel .acts{flex-basis:100%;justify-content:flex-end;padding:2px 0 4px}
 .rffl .rel{grid-template-columns:minmax(0,1fr)}
 .rffl .rel img{width:100%;max-width:320px}
 .rffl .fitem{grid-template-columns:auto minmax(0,1fr)}
 .rffl .fitem .fa{grid-column:1/-1;justify-content:flex-start}
}

<script>
/* RetroFixer · Floppy C64 · immagini disco D64 / D71 / D81
 * Lettura e scrittura di immagini in memoria (Uint8Array): directory, BAM, file, formattazione,
 * cancellazione, rinomina, validazione, blocchi. Usata dal visualizzatore e dal drive simulato.
 */
(function (RF) {
'use strict';

/* ---------- PETSCII ---------- */
// visualizzazione nel set maiuscole/grafica (quello di accensione del C64)
var GFX = {0x5C:'£',0x5E:'↑',0x5F:'←',0x60:'─',0x61:'♠',0x62:'│',0x63:'─',0x6B:'╮',0x6C:'╰',0x6D:'╯',0x6E:'╲',0x6F:'╱',
  0x71:'●',0x73:'♥',0x75:'╭',0x76:'╳',0x77:'○',0x78:'♣',0x7A:'♦',0x7B:'┼',0x7D:'│',0x7E:'π',0x7F:'◥',0xA0:' ',0xFF:'π'};
function petChar(b) {
  if (b >= 0x20 && b <= 0x5B) return String.fromCharCode(b);
  if (b === 0x5D) return ']';
  if (GFX[b]) return GFX[b];
  if (b >= 0xC0 && b <= 0xDF && GFX[b - 0x60]) return GFX[b - 0x60];
  if (b >= 0xC1 && b <= 0xDA) return String.fromCharCode(b - 0x80); // lettere "shiftate": nel set grafico sono simboli, le mostriamo come lettere
  if (b >= 0xE0 && b <= 0xFE) return '▒';
  if (b >= 0xA1 && b <= 0xBF) return '▒';
  return '·';
}
function petToStr(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += petChar(bytes[i]); return s; }
// testo del PC → PETSCII (maiuscolo, caratteri sconosciuti → '?')
function strToPet(str) {
  var out = [], s = String(str).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    if (c === 0xA3) out.push(0x5C);
    else if (c >= 0x20 && c <= 0x5D) out.push(c);
    else out.push(0x3F);
  }
  return out;
}
// nome di file del PC → nome C64 (16 caratteri, senza caratteri vietati nei nomi DOS)
function pcNameToC64(name) {
  var base = String(name).replace(/\.(prg|seq|usr|p00|s00|u00)$/i, '').replace(/[_]+/g, ' ');
  var p = strToPet(base).filter(function (b) { return b !== 0x2A && b !== 0x3F && b !== 0x2C && b !== 0x3A && b !== 0x3D && b !== 0x22 && b !== 0x24 && b !== 0x40 || false; });
  while (p.length && p[0] === 0x20) p.shift();
  return p.slice(0, 16).length ? p.slice(0, 16) : strToPet('SENZA NOME');
}
function c64NameToPc(bytes, ext) {
  var s = '';
  for (var i = 0; i < bytes.length; i++) {
    var b = bytes[i];
    if (b >= 0x41 && b <= 0x5A) s += String.fromCharCode(b + 32);
    else if (b >= 0xC1 && b <= 0xDA) s += String.fromCharCode(b - 0x80);
    else if ((b >= 0x30 && b <= 0x39) || b === 0x2D || b === 0x2E || b === 0x2B || b === 0x21 || b === 0x28 || b === 0x29) s += String.fromCharCode(b);

}
function bytesEq(a, b) { if (a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }
// confronto con i caratteri jolly del DOS: * = il resto, ? = un carattere qualsiasi
function wildMatch(pat, name) {
  for (var i = 0; i < pat.length; i++) {
    if (pat[i] === 0x2A) return true;
    if (i >= name.length) return false;
    if (pat[i] !== 0x3F && pat[i] !== name[i]) return false;
  }
  return pat.length === name.length;

/* ---------- formati ---------- */
var TYPES = ['DEL', 'SEQ', 'PRG', 'USR', 'REL', 'CBM'];
function zone(t) { return t <= 17 ? 21 : t <= 24 ? 19 : t <= 30 ? 18 : 17; }
var FORMATS = {
  d64: {id:'d64', label:'D64', drive:'1541', tracks:35, maxTracks:40, spt:function (t) { return zone(t); },
        dirTrack:18, header:[18,0], dirStart:[18,1], dos:'2A', fileIl:10, dirIl:3, reserved:[18]},
  d71: {id:'d71', label:'D71', drive:'1571', tracks:70, maxTracks:70, spt:function (t) { return zone(t > 35 ? t - 35 : t); },
        dirTrack:18, header:[18,0], dirStart:[18,1], dos:'2A', fileIl:6, dirIl:3, reserved:[18,53]},
  d81: {id:'d81', label:'D81', drive:'1581', tracks:80, maxTracks:80, spt:function () { return 40; },
        dirTrack:40, header:[40,0], dirStart:[40,3], dos:'3D', fileIl:1, dirIl:1, reserved:[40]}

function sizeFor(f, tracks) { var n = 0; for (var t = 1; t <= tracks; t++) n += f.spt(t); return n; }
// riconosce il formato dalla dimensione (con o senza i byte di errore in coda)
function detect(len) {

  for (var i = 0; i < c.length; i++) {
    var f = FORMATS[c[i][0]], n = sizeFor(f, c[i][1]);

function DiskError(code, msg, t, s) { var e = new Error(msg); e.code = code; e.t = t || 0; e.s = s || 0; return e; }

/* ---------- immagine ---------- */
function Disk(data, name) {
  var d = detect(data.length);
  if (!d) throw DiskError(0, 'Dimensione non riconosciuta (' + data.length + ' byte): servono immagini D64, D71 o D81.');
  this.fmt = d.fmt; this.tracks = d.tracks; this.sectors = d.sectors;
  this.data = data.slice(0, d.sectors * 256);
  this.errorBytes = d.errors ? data.slice(d.sectors * 256) : null;
  this.name = name || '';
  this.offs = [0, 0];
  for (var t = 1; t <= this.tracks; t++) this.offs[t + 1] = this.offs[t] + this.fmt.spt(t) * 256;
}
Disk.FORMATS = FORMATS;
Disk.detect = detect;
Disk.blank = function (fmtId, nameBytes, idBytes) {
  var f = FORMATS[fmtId] || FORMATS.d64, d = new Disk(new Uint8Array(sizeFor(f, f.tracks) * 256));
  d.format(nameBytes, idBytes || strToPet('00'));
  return d;
};

var P = Disk.prototype;
P.spt = function (t) { return this.fmt.spt(t); };
P.valid = function (t, s) { return t >= 1 && t <= this.tracks && s >= 0 && s < this.fmt.spt(t); };
P.off = function (t, s) {

P.block = function (t, s) { var o = this.off(t, s); return this.data.subarray(o, o + 256); };

qv///////////////////////////////////////////////////////////////////////////////////w=="}}; RF.FIRMWARE_SRC = {"rfiec.ino": "// RetroFixer RFIEC \u2013 il PC fa da drive (e da stampante) per il Commodore 64, oppure comanda drive e stampanti veri\n// ---------------------------------------------------------------------------\n// Firmware per Arduino Pro Micro (ATmega32U4, 5 V / 16 MHz) collegato al bus seriale IEC\n// con gli stessi fili della XUM1541 \"PROMICRO\" (nessun componente in pi\u00f9):\n//\n//   Pro Micro   segnale   pin DIN IEC\n//   16 (PB2)    DATA      5\n//   14 (PB3)    CLK       4\n//    8 (PB4)    ATN       3\n//    9 (PB5)    SRQ       1\n//   10 (PB6)    RESET     6   (letto come dispositivo, tirato a zero dal reset in modalit\u00e0 padrone)\n//   GND         GND       2\n//\n// Il Pro Micro fa la parte del DISPOSITIVO (drive o stampante): i tempi del bus li gestisce la\n// libreria IECDevice di David Hansel (GPL-3, https://github.com/dhansel/IECDevice); il firmware\n// passa al browser ogni evento del bus (LISTEN, TALK, dati, UNLISTEN, UNTALK) attraverso la seriale\n// USB, e il browser risponde con i dati del disco (il \"DOS\" sta nella pagina web).\n//\n// Dalla versione 2.0 c'\u00e8 anche la modalit\u00e0 PADRONE DEL BUS (comando 'M' 1): il Pro Micro fa quello che fa la XUM1541,\n// cio\u00e8 comanda il bus al posto del C64 (LISTEN, TALK, dati, UNLISTEN, UNTALK) per leggere e scrivere sui drive veri o\n// stampare su una stampante vera. I tempi sono quelli del bus seriale Commodore; il codice \u00e8 scritto qui da zero.\n//\n// Protocollo (binario, sulla seriale USB; la velocit\u00e0 impostata non conta):\n//   PC \u2192 Pro Micro\n//     'V'                              chiede la versione \u2192 risposta 'H'\n//     'C' slot dev flags               configura lo slot 0 (drive) o 1 (stampante): numero e attivazione (bit 0)\n//     'D' slot seq len flags dati[len] dati da mandare al C64 (len \u2264 64); flags bit0 = fine file, bit1 = nessun dato\n//     'F' slot loader proto            avvia un caricatore veloce riconosciuto dalla pagina (loader 2 = Final Cartridge III;\n//                                      proto 1 LOAD e 5 LOADIMG leggono il canale 0, 2 SAVE scrive sul canale 1;\n//                                      loader 1 = Epyx FastLoad, proto 3: il nome del file arriva dal caricatore)\n//     'M' modo                         0 = dispositivo (drive/stampante emulati), 1 = padrone del bus \u2192 risposta 'm' modo\n//   solo in modalit\u00e0 padrone del bus:\n//     'A' len flags byte[len]          byte sotto ATN (LISTEN/TALK/OPEN/CLOSE/UNLISTEN/UNTALK); flags bit0 = dopo c'\u00e8 un TALK:\n//                                      il PC diventa ascoltatore \u2192 risposta 'a' n err (byte accettati, 0 = nessun dispositivo;\n//                                      err: 0 bene, 1 nessuno tira DATA, 2 chi ascolta non si libera, 3 byte non confermato,\n//                                      4 il dispositivo non prende CLK dopo il TALK)\n//     'B' len flags byte[len]          dati per chi ascolta; flags bit0 = EOI sull'ultimo byte \u2192 risposta 'b' n\n//     'G' lo hi                        legge fino a lo+hi*256 byte da chi parla \u2192 risposte 'g' n flags byte[n] (n \u2264 60;\n//                                      flags bit0 = EOI ricevuto, bit1 = ultimo pezzo); si ferma dopo 1 s senza dati\n//     'X'                              RESET del bus (la linea RESET a zero per 100 ms) \u2192 risposta 'x'\n//     'S'                              misura delle linee \u2192 risposta 's' a b c d (porta B del 32U4: a = a riposo,\n//                                      b = a riposo con i pull-up interni, c = con ATN e CLK tirati dopo 1 ms,\n//                                      d = 100 ms dopo aver liberato tutto; bit 2 DATA, 3 CLK, 4 ATN, 6 RESET, 1 = alta)\n//   Pro Micro \u2192 PC\n//     'H' len testo                    versione del firmware\n//     'L' slot sec                     LISTEN con indirizzo secondario (0x6n dati, 0xEn CLOSE, 0xFn OPEN)\n//     'T' slot sec seq                 TALK (seq: numero della sessione di TALK)\n//     'U' slot                         UNLISTEN\n//     'K' slot seq lo hi               UNTALK: quanti byte il C64 ha letto davvero in questa sessione\n//     'W' slot len eoi dati[len]       byte mandati dal C64 (len \u2264 32)\n//     'Q' slot seq                     servono altri dati per il TALK in corso\n//     'R'                              la linea RESET del bus \u00e8 andata a zero\n//\n// Licenza: GPL-3.0 (come IECDevice).\n\n#include <Arduino.h>\n#include <util/delay.h>\n#include <IECDevice.h>\n#include <IECBusHandler.h>\n\n#define PIN_ATN    8\n#define PIN_CLK   14\n#define PIN_DATA  16\n#define PIN_RESET 10\n#define PIN_SRQ    9\n\n#define FW_VERSION \"RFIEC 2.6\"\n\n// Porta seriale aperta dal PC. NON usare \"(bool) Serial\" sul 32U4: contiene un delay(10), e la libreria\n// chiama isActive() mentre il C64 manda l'indirizzo sotto ATN (che va confermato entro 1 ms).\nstatic bool hostUp = false;\nstatic bool lineUp() { return Serial.dtr() || Serial.rts(); }\n\n// ---------------- coda verso il PC ----------------\n#define OQ_SIZE 256\nstatic uint8_t  oq[OQ_SIZE];\nstatic uint16_t oqHead = 0, oqTail = 0;\nstatic uint16_t oqUsed() { return (uint16_t)(oqHead - oqTail); }\nstatic uint16_t oqFree() { return OQ_SIZE - oqUsed(); }\nstatic bool oqPut(const uint8_t *b, uint8_t n)\n{\n  if( oqFree() < n ) return false;\n  for(uint8_t i=0; i<n; i++) oq[(oqHead++) % OQ_SIZE] = b[i];\n  return true;\n}\nstatic void oqPump()\n{\n  uint16_t n = oqUsed();\n  if( n==0 || !hostUp ) return;\n  int room = Serial.availableForWrite();\n  if( room <= 0 ) return;\n  uint8_t chunk[32];\n  uint8_t k = 0;\n  while( k < sizeof(chunk) && k < (uint16_t) room && k < n ) chunk[k++] = oq[(oqTail++) % OQ_SIZE];\n  Serial.write(chunk, k);\n}\n\n// ---------------- padrone del bus (come la XUM1541) ----------------\n// Linee open collector sulla porta B: \"tirata\" = uscita a zero, \"libera\" = ingresso senza pull-up (le resistenze\n// le hanno il drive e la stampante). Le attese brevi si fanno a interrupt spenti e si contano in microsecondi.\n#define LN_DATA _BV(2)   // PB2 = pin 16\n#define LN_CLK  _BV(3)   // PB3 = pin 14\n#define LN_ATN  _BV(4)   // PB4 = pin 8\n#define LN_RST  _BV(6)   // PB6 = pin 10\nstatic bool master = false;\nstatic inline void lnLow(uint8_t m)  { PORTB &= ~m; DDRB |= m; }\nstatic inline void lnFree(uint8_t m) { DDRB &= ~m; PORTB &= ~m; }\nstatic inline bool lnIsLow(uint8_t m) { return (PINB & m) == 0; }\nstatic void lnFreeAll() { lnFree(LN_DATA | LN_CLK | LN_ATN | LN_RST); }\n// attesa breve (interrupt spenti): vero se la linea arriva allo stato voluto entro us microsecondi\n// (delayMicroseconds(1) sul 16 MHz non aspetta quasi niente: si usa _delay_us, un ciclo di attesa esatto)\nstatic bool waitShort(uint8_t m, bool low, uint16_t us)\n{\n  for( uint16_t n = 0; n < us; n++ ) { if( lnIsLow(m) == low ) return true; _delay_us(1); }\n  return lnIsLow(m) == low;\n}\nstatic uint8_t mErr = 0;\n// attesa lunga (interrupt accesi), in millisecondi; si interrompe se la pagina chiude la porta seriale\nstatic bool waitLong(uint8_t m, bool low, uint16_t ms)\n{\n  unsigned long t0 = millis();\n  uint8_t k = 0;\n  while( lnIsLow(m) != low )\n    {\n      if( millis() - t0 > ms ) return false;\n      if( ++k==0 && !(Serial.dtr() || Serial.rts()) ) return false;\n    }\n  return true;\n}\n// un byte da \"parlatore\": 0 = ricevuto, 1 = chi ascolta non \u00e8 pronto, 2 = nessuna conferma\nstatic uint8_t mSendByte(uint8_t b, bool eoi, uint16_t readyMs)\n{\n  lnFree(LN_CLK);                                   // pronto a mandare\n  if( !waitLong(LN_DATA, false, readyMs) ) { mErr = 2; return 1; }  // chi ascolta libera DATA quando \u00e8 pronto\n  noInterrupts();\n  if( eoi )\n    {\n      // EOI: si aspetta senza tirare CLK; chi ascolta lo conferma tirando DATA per almeno 60 us\n      if( !waitShort(LN_DATA, true, 2000) || !waitShort(LN_DATA, false, 2000) ) { interrupts(); return 2; }\n    }\n  lnLow(LN_CLK);\n  // tempi come nella XUM1541 di OpenCBM: CLK resta basso 75 us prima di ogni bit (il 1541 non regge i 20 us\n  // minimi delle specifiche), il bit si mette 2 us prima di liberare CLK e resta valido 20 us\n  for( uint8_t i = 0; i < 8; i++ )\n    {\n      delayMicroseconds(75);\n      if( !(b & 1) ) { lnLow(LN_DATA); _delay_us(2); }\n      lnFree(LN_CLK);                                 // bit valido\n      delayMicroseconds(20);\n      lnLow(LN_CLK);\n      lnFree(LN_DATA);\n      b >>= 1;\n    }\n  bool ack = waitShort(LN_DATA, true, 2000);        // conferma del byte (1 ms per le specifiche, si tollera il doppio)\n  interrupts();\n  delayMicroseconds(100);\n  if( !ack ) mErr = 3;\n  return ack ? 0 : 2;\n}\n// byte sotto ATN; talk: dopo l'ultimo il PC diventa ascoltatore (il dispositivo prende CLK)\nstatic uint8_t mAtn(const uint8_t *b, uint8_t n, bool talk)\n{\n  lnFree(LN_DATA); lnLow(LN_CLK); lnLow(LN_ATN);\n  mErr = 0;\n  // i dispositivi rispondono tirando DATA entro 1 ms (si aspetta fino a 2 ms, come la XUM1541)\n  if( !waitShort(LN_DATA, true, 2000) ) { lnFree(LN_ATN); lnFree(LN_CLK); mErr = 1; return 0; }   // nessun dispositivo\n  delayMicroseconds(40);\n  uint8_t sent = 0;\n  // un drive occupato (per esempio mentre legge la directory dopo un OPEN) risponde all'ATN solo quando ha finito:\n  // come la XUM1541 si aspetta che sia pronto (qui fino a 30 s)\n  while( sent < n && mSendByte(b[sent], false, 30000)==0 ) sent++;\n  if( sent < n ) { delayMicroseconds(20); lnFreeAll(); return sent; }   // byte non passato: si libera il bus\n  if( talk && sent==n )\n    {\n      // inversione dei ruoli: il PC tira DATA e libera ATN e CLK, poi il drive prende CLK quando ha finito di\n      // gestire l'ATN. Il 1541 ci mette alcuni millisecondi (il Kernal del C64 aspetta senza limite): fino a 100 ms.\n      lnLow(LN_DATA); delayMicroseconds(20); lnFree(LN_ATN); lnFree(LN_CLK);\n      if( !waitLong(LN_CLK, true, 100) ) { lnFreeAll(); mErr = 4; return 0; }\n    }\n  else\n    {\n      delayMicroseconds(20);\n      lnFree(LN_ATN);\n      // dopo UNLISTEN o UNTALK il bus torna libero; dopo LISTEN il PC resta parlatore (tiene CLK)\n      if( sent==0 || b[sent-1]==0x3F || b[sent-1]==0x5F ) { delayMicroseconds(100); lnFree(LN_CLK); lnFree(LN_DATA); }\n    }\n  return sent;\n}\n// un byte da \"ascoltatore\": -1 = chi parla non \u00e8 pronto (dopo readyMs), -2 = errore, altrimenti byte | 0x100 se EOI\nstatic int16_t mRecvByte(uint16_t readyMs)\n{\n  if( !waitLong(LN_CLK, false, readyMs) ) return -1; // chi parla libera CLK quando \u00e8 pronto\n  bool eoi = false;\n  noInterrupts();\n  lnFree(LN_DATA);                                  // pronti a ricevere\n  if( !waitShort(LN_CLK, true, 400) )\n    {\n      // niente bit entro 200 us: \u00e8 l'ultimo byte (EOI), lo confermiamo tirando DATA per 70 us\n      eoi = true;\n      lnLow(LN_DATA); delayMicroseconds(70); lnFree(LN_DATA);\n      if( !waitShort(LN_CLK, true, 2000) ) { interrupts(); return -2; }\n    }\n  uint8_t b = 0;\n  for( uint8_t i = 0; i < 8; i++ )\n    {\n      if( !waitShort(LN_CLK, false, 1000) ) { interrupts(); return -2; }\n      if( !lnIsLow(LN_DATA) ) b |= (1 << i);\n      if( !waitShort(LN_CLK, true, 1000) ) { interrupts(); return -2; }\n    }\n  lnLow(LN_DATA);                                   // byte ricevuto\n  interrupts();\n  delayMicroseconds(50);\n  return (int16_t) b | (eoi ? 0x100 : 0);\n}\nstatic void oqWait(uint8_t need) { while( oqFree() < need && hostUp ) { oqPump(); hostUp = Serial.dtr() || Serial.rts(); } }\nstatic void mRead(uint16_t len)\n{\n  uint8_t buf[60], k = 0, flags = 0;\n  for( uint16_t got = 0; got < len; got++ )\n    {\n      int16_t r = mRecvByte(1000);\n      if( r < 0 ) break;\n      buf[k++] = r & 0xFF;\n      if( r & 0x100 ) { flags = 1; break; }\n      if( k==sizeof(buf) ) { uint8_t h[3] = {'g', k, 0}; oqWait(3 + k); oqPut(h, 3); oqP qPut(q, 3) ) pending = true;\n      }\n  }\n\n protected:\n  virtual void reset()\n  {\n    talking = false; rbCount = 0; wlen = 0;\n    if( m_slot==0 ) { uint8_t r = 'R'; oqPut(&r, 1); }\n  }\n\n public:\n  // caricatore veloce chiesto dalla pagina (Final Cartridge III)\n  void startFast(uint8_t loader, uint8_t proto)\n  {\n#ifdef IEC_FP_EPYX\n    // Epyx: la libreria riceve il nome del file, lo apre sul canale 0 (listen/write/unlisten) e poi chiede i dati\n    if( loader==IEC_FP_EPYX && proto==IEC_FL_PROT_HEADER ) { fastLoadRequest(loader, proto); return; }\n#endif\n#ifdef IEC_FP_FC3\n    if( loader!=IEC_FP_FC3 ) return;\n    if( proto==IEC_FL_PROT_LOAD || proto==IEC_FL_PROT_LOADIMG )\n      talk(0x60);                             // i dati arrivano dal canale 0, come un TALK normale\n    else if( proto==IEC_FL_PROT_SAVE )\n      listen(0x61);                           // i dati vanno al canale 1 (il file aperto con SAVE)\n    else\n      return;\n    fastLoadRequest(loader, proto);\n#endif\n  }\n\n  // trasferimenti a blocchi (JiffyDOS, Final Cartridge III): qui si pu\u00f2 aspettare il PC quanto serve\n  virtual uint8_t read(uint8_t *buffer, uint8_t n)\n  {\n    uint8_t got = 0;\n    unsigned long t0 = millis();\n    while( got < n )\n      {\n        if( rbCount )\n          {\n            buffer[got++] = rb[rbHead];\n            rbHead = (rbHead + 1) % RB_SIZE; rbCount--; consumed++;\n            t0 = millis();\n            continue;\n          }\n        if( !talking ) talk(0x60);           // primo blocco di un caricatore veloce: dati dal canale 0\n        if( !more || !hostUp || millis()-t0 > 3000 ) break;\n        prefetch();\n        serviceHost();\n      }\n    return got;\n  }\n\n  virtual uint8_t write(uint8_t *buffer, uint8_t n, bool eoi)\n  {\n    unsigned long t0 = millis();\n    for(uint8_t i=0; i<n; i++)\n      {\n        while( canWrite() < 0 )\n          {\n            if( !hostUp || millis()-t0 > 3000 ) return i;\n            serviceHost();\n eturn 0;\n    uint8_t d = rb[rbHead];\n    rbHead = (rbHead + 1) % RB_SIZE; rbCount--; consumed++;\n    return d;\n  }\n};\n\nstatic RFDevice drive(0, 8), printer(1, 4);\nstatic RFDevice *devs[2] = {&drive, &printer};\nstatic IECBusHandler bus(PIN_ATN, PIN_CLK, PIN_DATA, PIN_RESET, 0xFF, PIN_SRQ);\n\n// ---------------- comandi dal PC ----------------\nstatic uint8_t ib[72];\nstatic uint8_t ibLen = 0;\n\nstatic uint8_t frameLen(const uint8_t *b, uint8_t n)\n{\n  // restituisce la lunghezza del comando se \u00e8 completo, 0 se ne mancano ancora pezzi\n  switch( b[0] )\n    {\n    case 'V': return 1;\n    case 'C': return n >= 4 ? 4 : 0;\n    case 'D': if( n < 5 ) return 0; return (n >= 5 + b[3]) ? 5 + b[3] : 0;\n    case 'F': return n >= 4 ? 4 : 0;\n    case 'M': return n >= 2 ? 2 : 0;\n    case 'A': case 'B': if( n < 3 ) return 0; return (n >= 3 + b[1]) ? 3 + b[1] : 0;\n    case 'G': return n >= 3 ? 3 : 0;\n    case 'X': return 1;\n    case 'S': return 1;\n    default:  return 1;                       // byte sconosciuto: si scarta\n    }\n}\n\nstatic void handleFrame(const uint8_t *b, uint8_t n)\n{\n  if( b[0]=='V' )\n    {\n      const char *v = FW_VERSION;\n      uint8_t h[2] = {'H', (uint8_t) strlen(v)};\n      oqPut(h, 2); oqPut((const uint8_t *) v, strlen(v));\n    }\n  else if( b[0]=='C' && b[1] < 2 )\n    {\n      devs[b[1]]->setDeviceNumber(b[2]);\n      devs[b[1]]->m_enabled = (b[3] & 1)!=0;\n    }\n  else if( b[0]=='D' && b[1] < 2 && b[3] <= 64 )\n    devs[b[1]]->dataFromHost(b[2], b + 5, b[3], b[4]);\n  else if( b[0]=='F' && b[1]==0 )\n    drive.startFast(b[2], b[3]);\n  else if( b[0]=='M' )\n    {\n      // padrone del bus: i dispositivi emulati tacciono e la libreria non guarda pi\u00f9 il bus\n      drive.m_enabled = printer.m_enabled = false;\n      setMaster(b[1]==1);\n    }\n  else if( master && b[0]=='A' && b[1] <= 64 )\n    {\n      uint8_t n = mAtn(b + 3, b[1], (b[2] & 1)!=0);\n      uint8_t r[3] = {'a', n, mErr};\n      oqWait(3); oqPut(r, 3);\n    }\n  else if( master && b[0]=='B' && b[1] <= 64 )\n    mWrite(b + 3, b[1], (b[2] & 1)!=0);\n  else if( master && b[0]=='G' )\n    mRead(b[1] | (b[2] << 8));\n  else if( master && b[0]=='S' )\n    {\n      uint8_t r[5] = {'s', 0, 0, 0, 0};\n      lnFreeAll(); delayMicroseconds(200); r[1] = PINB;\n      PORTB |= LN_DATA | LN_CLK | LN_ATN | LN_RST; delayMicroseconds(200); r[2] = PINB; lnFreeAll();\n      lnLow(LN_ATN); lnLow(LN_CLK); delayMicroseconds(1000); r[3] = PINB;\n      lnFreeAll(); delay(100); r[4] = PINB;\n      oqWait(5); oqPut(r, 5);\n    }\n  else if( master && b[0]=='X' )\n    {\n      lnFreeAll(); lnLow(LN_RST); delay(100); lnFree(LN_RST);\n      uint8_t r = 'x'; oqPut(&r, 1);\n    }\n}\n\nstatic void pumpInput()\n{\n  // al massimo 64 byte per giro, per tornare presto a bus.task()\n  for(uint8_t k=0; k<64 && Serial.available(); k++)\n    {\n      if( ibLen < sizeof(ib) ) ib[ibLen++] = Serial.read(); else { ibLen = 0; continue; }\n      uint8_t fl = frameLen(ib, ibLen);\n      if( fl )\n        {\n          handleFrame(ib, fl);\n          ibLen = 0;\n        }\n    }\n}\n\nvoid setup()\n{\n  Serial.begin(115200);\n  bus.attachDevice(&drive);\n  bus.attachDevice(&printer);\n#ifdef IEC_FP_JIFFY\n  drive.enableFastLoader(IEC_FP_JIFFY, true);\n#endif\n#ifdef IEC_FP_FC3\n  drive.enableFastLoader(IEC_FP_FC3, true);\n#endif\n#ifdef IEC_FP_EPYX\n  drive.enableFastLoader(IEC_FP_EPYX, true);\n#endif\n  bus.begin();\n}\n\nvoid loop()\n{\n  // in modalit\u00e0 padrone il bus lo comandiamo noi: la libreria non deve rispondere al nostro ATN\n  if( !master ) bus.task();\n  bool up = lineUp();\n  if( up != hostUp )\n    {\n      // il PC ha aperto o chiuso la porta: si riparte da zero, i dispositivi si spengono finch\u00e9 il PC non li configura\n      hostUp = up; oqHead = oqTail = 0; ibLen = 0;\n      drive.m_enabled = printer.m_enabled = false;\n      if( master ) { lnFreeAll(); master = false; }\n    }\n  if( !up ) return;\n  pumpInput();\n  drive.prefetch();\n   mEmu: 'Il PC fa da drive', mEmuS: 'C64 collegato all\'interfaccia (firmware RFIEC)',
  emuGo: 'Collega la RFIEC', emuDl: 'Scarica il disco', dD64: 'vuoto D64 (1541)', dD71: 'vuoto D71 (1571)', dD81: 'vuoto D81 (1581)',
  emuIdle: 'Collega il C64 alla presa IEC della scheda, carica sul Pro Micro il firmware <b>RFIEC</b> (pulsante «Firmware del Pro Micro…») e premi <b>Collega</b>: il browser mostra le porte seriali, scegli quella del Pro Micro.',
  emuNoSerial: 'Questo browser non ha Web Serial: serve Chrome, Edge o Firefox (dalla versione 151) su computer.',
  emuNoFw: 'La porta si è aperta ma non risponde il firmware RFIEC: sul Pro Micro c\'è ancora la XUM1541? Usa «Firmware del Pro Micro…».',
  emuOpenErr: 'Non riesco ad aprire la porta seriale: forse la sta usando un altro programma (Arduino IDE, un\'altra scheda del browser).',
  emuOn: 'Collegata: <b>{v}</b>. Sul C64 scrivi <code>LOAD"$",{d}</code> e poi <code>LIST</code>.',
  emuLost: 'L\'interfaccia è stata scollegata.',
  emuHelpT: 'Come funziona',
  emuHelpL: '<li>Il C64 vede il PC come un drive (numero 8 o quello scelto): <code>LOAD"$",8</code>, <code>LOAD"NOME",8,1</code>, <code>SAVE</code>, <code>OPEN</code>, il canale 15 e i comandi DOS funzionano sul disco che vedi qui sotto.</li>' +
    '<li>Funziona con le routine del Kernal e con i caricatori veloci <b>JiffyDOS</b>, <b>Final Cartridge III</b> ed <b>Epyx FastLoad</b>. Non funzionano i caricatori che fanno girare un programma proprio nella memoria del 1541 (molte demo e giochi): per quelli serve un drive vero o un emulatore completo come Pi1541 o 1541 Ultimate.</li>' +
    '<li>Lo stesso firmware fa anche la stampante: vedi la pagina <a href="/stampante-commodore/">Stampante Commodore</a>.</li>' +
    '<li>Sul bus non deve esserci un drive vero con lo stesso numero. Collega e scollega i cavi con il C64 spento.</li>' +
    '<li>Puoi trascinare file sul disco, aprire immagini dalla scheda «Immagine disco» con «Inserisci nel drive simulato», e scaricare il disco con quello che il C64 ha salvato.</li>' +
    '<li>La stessa scheda fa la XUM1541 o l\'RFIEC, non tutte e due insieme: per cambiare usa «Firmware del Pro Micro…».</li>',
  flagEmu: '<b>DRIVE EMULATO</b> Il C64 vede questo disco come drive {d}. Tutto quello che salva finisce qui: scarica il disco per tenerlo.',
  flagEmuWait: 'In attesa del C64…', drvTEmu: 'Disco emulato (drive {d})',
  c64Load: 'C64 → LOAD "{n}"', c64Save: 'C64 → SAVE "{n}"', c64Open: 'C64 → OPEN {s},"{n}"', c64Cmd: 'C64 → comando "{n}"', c64Sent: 'C64 ← {n} byte', c64Recv: 'C64 → {n} byte', c64Speed: ' in {s} s · {v}', c64Reset: 'C64: reset del bus', c64Err: ' → {s}',
  bFw: 'Firmware del Pro Micro…', fwT: 'Firmware del Pro Micro', fwWhich: 'Firmware',
  fwB: '<p>La stessa scheda può fare due lavori diversi, a seconda del firmware:</p><p><b>RFIEC</b> (consigliato, senza driver): il PC fa da drive o da stampante per il C64, e comanda anche i drive veri con «Collega la RFIEC».<br><b>XUM1541</b>: il PC comanda un drive vero con «Collega la xum1541»; serve per OpenCBM e gli altri programmi del PC, e su Windows vuole il driver WinUSB. Scegli la versione <code>7406</code> solo se la tua scheda ha l\'integrato 7406.</p><p>Il firmware viene scritto attraverso il bootloader del Pro Micro, che resta sempre al suo posto: si può cambiare quando si vuole. Serve Chrome, Edge o Firefox dalla versione 151.</p>',
  fwSrc: '⬇ Sorgenti RFIEC', fwDl: '⬇ Scarica .hex', fwGo: 'Installa',
  fwBootAuto: '<p>Il Pro Micro si è riavviato nel bootloader, che resta attivo per circa <b>8 secondi</b>: premi subito <b>Scegli il bootloader</b> e seleziona la porta che compare (di solito con un nome diverso da prima).</p>',
  fwBootManual: '<p>Premi <b>due volte di seguito</b> il pulsante di reset del Pro Micro (o tocca due volte il pin RST con GND): il LED lampeggia piano e il bootloader resta attivo per circa <b>8 secondi</b>. Subito dopo premi <b>Scegli il bootloader</b> e seleziona la porta che compare.</p><p>Con la XUM1541 installata Windows non la mostra come porta: è normale, compare solo il bootloader dopo il doppio reset.</p>',
  fwPick: 'Scegli il bootloader', fwWriting: 'Scrittura', fwVerify: 'Verifica', fwDone: '{n} installato. Scollega e ricollega la scheda se Windows non la vede.',
  flagOffEmu: '<b>○ OFFLINE</b> Nessuna interfaccia collegata. Carica sul Pro Micro il firmware RFIEC, collega il C64 e premi «Collega» qui sopra.',
  trySim: 'Prova la simulazione', drvTSim: 'Disco simulato', drvTOff: 'Drive non collegato',
  bSep: 'Separatore…', bImgSep: '+ Separatore', opSep: 'Scrittura del separatore', sepT: 'Aggiungi un separatore',
  sepB: '<p>Aggiunge alla directory una riga come <code>0 "----------------" DEL</code>: un file DEL da 0 blocchi, che non occupa spazio. Va nel primo posto libero della directory, di solito in fondo.</p><p>Sul drive vero si scrive direttamente il blocco della directory (comandi <code>U1</code>/<code>U2</code>): funziona con Chrome ed Edge, come tutto il collegamento USB. Nelle immagini D64, D71 e D81 funziona in ogni browser.</p>',
  sepStyle: 'Stile', sepDash: '- - - trattini', sepLine: '─── linea grafica PETSCII', sepEq: '=== uguale', sepStar: '*** asterischi', sepCustom: 'testo personalizzato', sepText: 'Testo (solo per «personalizzato», max 16)', sepLock: 'protetto «<» (consigliato: il DOS non lo cancella con S:)', bSepGo: 'Aggiungi',
  sepDone: 'Separatore aggiunto.', delSepB: '<p>Togliere il separatore <b>«{n}»</b>? Viene cancellata solo la sua riga nella directory.</p>', imgChanged: 'Immagine modificata: scaricala per salvarla sul PC.', aRm: '✕ Togli',

  usbNoSer: 'Questo browser non ha WebUSB: la <b>xum1541</b> si collega solo con <b>Chrome</b> o <b>Edge</b>. La <b>RFIEC</b> invece funziona anche qui, attraverso Web Serial.',
  usbNo: 'Questo browser non supporta WebUSB né Web Serial: per collegare la xum1541 o la RFIEC serve <b>Chrome</b>, <b>Edge</b> o un altro browser Chromium su computer. Il drive simulato e il visualizzatore di immagini funzionano ovunque.',
  usbNoSecure: 'WebUSB funziona solo su pagine https.',
  usbIdle: 'Collega la xum1541 (o la ZoomFloppy) a una porta USB, accendi il drive e premi <b>Collega</b>: il browser mostrerà l\'elenco dei dispositivi compatibili.',

  usbCancel: 'Nessun dispositivo scelto.',
  usbClaim: 'Il browser vede la xum1541 ma non riesce ad aprirla. Su Windows serve il driver <b>WinUSB</b> (vedi sotto); su Linux una regola udev; ovunque, chiudi gli altri programmi che la usano (OpenCBM, cbmctrl, VICE).',
  usbLost: 'La xum1541 è stata scollegata.',
  helpT: 'Prima di collegarla: browser, driver e permessi',
  helpL: '<li><b>Senza driver</b>: con il firmware <b>RFIEC 2.0</b> la stessa scheda fa anche la XUM1541 attraverso la porta seriale. Premi «Collega la RFIEC»: niente Zadig e niente cambio di firmware tra drive vero e drive emulato. Per OpenCBM e gli altri programmi del PC serve invece il firmware XUM1541.</li>' +
   '<li><b>Browser</b>: Chrome, Edge, Opera o Brave su computer. Firefox e Safari non hanno WebUSB: con Firefox dalla versione 151 funziona però la <b>RFIEC</b>, che usa Web Serial.</li>' +
   '<li><b>Windows</b>: Chrome può usare solo dispositivi con il driver <b>WinUSB</b>. Scarica <a href="https://zadig.akeo.ie/" target="_blank" rel="noopener">Zadig</a>, menu <i>Options → List All Devices</i>, scegli la xum1541 (VID <code>16D0</code>, PID <code>0504</code>), seleziona <i>WinUSB</i> e premi <i>Replace Driver</i>. Se prima usavi OpenCBM con un altro driver (libusb-win32 o libusbK), controlla che funzioni ancora.</li>' +
   '<li><b>Linux</b>: crea <code>/etc/udev/rules.d/45-xum1541.rules</code> con<br><code>SUBSYSTEM=="usb", ATTR{idVendor}=="16d0", ATTR{idProduct}=="0504", TAG+="uaccess"</code><br>poi <code>sudo udevadm control --reload-rules</code> e ricollega la xum1541.</li>' +
   '<li><b>macOS</b>: non servono driver.</li>' +
   '<li>La xum1541 può essere usata da un solo programma alla volta: chiudi OpenCBM, cbmctrl e simili.</li>' +
   '<li>Senza caricatori veloci il bus seriale è lento: leggere o scrivere un disco intero richiede vari minuti.</li>',

  credits: '<p>Il protocollo USB della xum1541 è quello documentato dal progetto <a href="https://github.com/OpenCBM/OpenCBM" target="_blank" rel="noopener">OpenCBM</a> (firmware di Nate Lawson): questa pagina ne è un\'implementazione indipendente in JavaScript con WebUSB. I file di <a href="https://csdb.dk/" target="_blank" rel="noopener">CSDb</a> restano dei rispettivi autori.</p><p>Prototipo: con l\'hardware vero vanno ancora verificati driver, tempi e copie di dischi interi. I dischi originali protetti da copia non si possono duplicare con i comandi del DOS.</p>',

 en: {
  title: 'C64 floppies in the browser',
  intro: 'Connect a 1541, 1571 or 1581 drive to your computer with an xum1541 or ZoomFloppy and manage disks from this page: directory, format, scratch, rename, copy PRG files from your PC and from CSDb, D64 images. No hardware? Try everything with the simulated drive.',
  connT: 'Connection', mUsb: 'Real drive', mUsbS: 'xum1541, ZoomFloppy or RFIEC: the PC uses real floppies', mSim: 'Simulation', mSimS: 'no hardware: no real floppy is touched',
  flagOn: '<b>● ONLINE</b> Real {m} drive connected through the xum1541: operations read and write the floppy in the drive.',
  flagOff: '<b>○ OFFLINE</b> No drive connected. Connect the xum1541 above, or try the simulation; D64 images can be managed anyway in the “Disk image” tab.',
  flagSim: '<b>SIMULATION</b> Virtual disk in memory: no real floppy is read or written. To work on real disks you need the xum1541; without it you can try the commands and manage D64 images.',
  mEmu: 'PC as a drive', mEmuS: 'C64 connected to the adapter (RFIEC firmware)',
  emuGo: 'Connect the RFIEC', emuDl: 'Download the disk', dD64: 'empty D64 (1541)', dD71: 'empty D71 (1571)', dD81: 'empty D81 (1581)',
  emuIdle: 'Connect the C64 to the board\'s IEC socket, load the <b>RFIEC</b> firmware onto the Pro Micro (button “Pro Micro firmware…”) and press <b>Connect</b>: the browser lists the serial ports, pick the Pro Micro.',
  emuNoSerial: 'This browser has no Web Serial: you need Chrome, Edge or Firefox (version 151 or later) on a computer.',
  emuNoFw: 'The port opened but the RFIEC firmware does not answer: is the Pro Micro still running the XUM1541? Use “Pro Micro firmware…”.',
  emuOpenErr: 'Cannot open the serial port: another program may be using it (Arduino IDE, another browser tab).',
  emuOn: 'Connected: <b>{v}</b>. On the C64 type <code>LOAD"$",{d}</code> and then <code>LIST</code>.',
  emuLost: 'The adapter was disconnected.',
  emuHelpT: 'How it works',
  emuHelpL: '<li>The C64 sees the PC as a drive (number 8 or the one you pick): <code>LOAD"$",8</code>, <code>LOAD"NAME",8,1</code>, <code>SAVE</code>, <code>OPEN</code>, channel 15 and DOS commands work on the disk shown below.</li>' +
    '<li>It works with the Kernal routines and with the <b>JiffyDOS</b>, <b>Final Cartridge III</b> and <b>Epyx FastLoad</b> fast loaders. Loaders that run their own program in the 1541\'s memory (many demos and games) do not work: they need a real drive or a full emulator like Pi1541 or 1541 Ultimate.</li>' +
    '<li>The same firmware is also a printer: see the <a href="/stampante-commodore/">Commodore printer</a> page.</li>' +
    '<li>There must be no real drive with the same number on the bus. Plug and unplug cables with the C64 switched off.</li>' +
    '<li>You can drop files on the disk, open images from the “Disk image” tab with “Insert in simulated drive”, and download the disk with whatever the C64 saved.</li>' +
    '<li>The same board runs either the XUM1541 or RFIEC, not both at once: use “Pro Micro firmware…” to switch.</li>',
  flagEmu: '<b>EMULATED DRIVE</b> The C64 sees this disk as drive {d}. Everything it saves ends up here: download the disk to keep it.',
  flagEmuWait: 'Waiting for the C64…', drvTEmu: 'Emulated disk (drive {d})',

/* ---------- registro ---------- */
var logEl = $('rfflLog'), logLines = [];
function log(kind, msg) {
  var d = new Date(), t = d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
  logLines.push(t + ' ' + kind.padEnd(4) + ' ' + msg);
  if (logLines.length > 3000) logLines.splice(0, 1000);
  var div = document.createElement('div');
  div.className = 'k-' + kind;
  div.innerHTML = '<span class="t">' + t + '</span> ' + esc(msg);
  logEl.appendChild(div);
  while (logEl.childNodes.length > 800) logEl.removeChild(logEl.firstChild);
  if (!$('rfflPLog').hidden) logEl.scrollTop = logEl.scrollHeight;
}

/* ---------- avvisi ---------- */
var toastT;
function toast(msg, err) {
  var el = root.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); root.appendChild(el); }
  el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, err ? 7000 : 3500);
  if (err) log('err', msg);
}
function errMsg(e) { return e && e.status ? tr('driveSays', {s: e.status.text}) : (e && e.message) || String(e); }

/* ---------- finestre di dialogo ---------- */
var dlg = $('rfflDlg');
function ask(o) {
  return new Promise(function (resolve) {
    var f = '<form method="dialog"><h3>' + esc(o.title) + '</h3><div class="body">' + (o.body || '') + '</div>';
    if (o.fields && o.fields.length) {
      f += '<div class="fields">';
      o.fields.forEach(function (x) {
        if (x.type === 'check') f += '<label class="ck"><input type="checkbox" name="' + x.id + '"' + (x.value ? ' checked' : '') + '><span>' + esc(x.label) + '</span></label>';
        else if (x.type === 'select') f += '<label>' + esc(x.label) + '<select name="' + x.id + '">' + x.options.map(function (op) { return '<option value="' + op[0] + '"' + (op[0] === x.value ? ' selected' : '') + '>' + esc(op[1]) + '</option>'; }).join('') + '</select></label>';
        else f += '<label>' + esc(x.label) + '<input type="text" name="' + x.id + '" value="' + esc(x.value || '') + '" maxlength="' + (x.max || 40) + '" autocomplete="off" spellcheck="false"' + (x.free ? ' class="free"' : '') + '></label>';
      });
      f += '</div>';
    }
    // il primo pulsante nel DOM è quello che parte con Invio: i pulsanti sono in ordine inverso e la CSS li rimette a posto
    f += '<div class="out" id="rfflDlgOut"></div><div class="btns">';
    (o.buttons || [{v: 'ok', label: o.ok || 'OK', cls: o.danger ? 'warn' : 'pri'}]).slice().reverse().forEach(function (b) {
      f += '<button class="btn ' + (b.cls || '') + '" value="' + b.v + '" type="submit">' + esc(b.label) + '</button>';
    });
    if (o.cancel !== false) f += '<button class="btn" value="cancel" type="submit" formnovalidate>' + esc(o.cancel || tr('cancel')) + '</button>';
    f += '</div></form>';
    dlg.innerHTML = f;
    var form = dlg.querySelector('form');
    function values() {
      var v = {};
      (o.fields || []).forEach(function (x) { var el = form.elements[x.id]; v[x.id] = x.type === 'check' ? el.checked : el.value; });
      return v;
    }
    // si risponde subito al clic, senza aspettare l'evento "close" (che in alcune schede in background arriva in ritardo)
    var done = false;
    function finish(b) {
      if (done) return;
      done = true;
      var v = b === 'cancel' ? null : Object.assign({_b: b}, values());
      if (dlg.open) dlg.close();
      resolve(v);
    }
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var b = ev.submitter ? ev.submitter.value : 'ok';
      if (b !== 'cancel' && o.onSubmit) { o.onSubmit(values(), $('rfflDlgOut'), b); return; }
      finish(b);
    });
    dlg.oncancel = function (ev) { ev.preventDefault(); finish('cancel'); };
    dlg.onclose = function () { finish('cancel'); };
    dlg.showModal();
    var first = form.querySelector('input[type=text]');
    if (first) { first.focus(); first.select(); }
  });
}

/* ---------- operazioni con avanzamento ---------- */
function setBusy(b) {
  st.busy = b;
  $('rfflLed').classList.toggle('on', b);
  updateButtons();
}
function progress(label) {
  $('rfflProg').hidden = false; $('rfflProgL').textContent = label;
  $('rfflBar').classList.add('ind'); $('rfflBar').firstChild.style.width = '0'; $('rfflEta').textContent = '';
  return function (done, total, ms, t, s, phase) {
    if (phase === 'format') { $('rfflProgL').textContent = tr('opFmtFirst'); return; }
    $('rfflProgL').textContent = label;
    if (!total) return;
    $('rfflBar').classList.remove('ind');
    $('rfflBar').firstChild.style.width = Math.min(100, done / total * 100).toFixed(1) + '%';
    var left = done ? ms / done * (total - done) : 0;
    if (t !== undefined) $('rfflEta').textContent = tr('etaBlk', {d: done, t: total, tt: t, ss: s, e: fmtDur(left)});
    else $('rfflEta').textContent = tr('eta', {d: nfmt(done), t: nfmt(total), r: tr('rate', {v: ms > 300 ? nfmt(Math.round(done / ms * 1000)) : '—'}), e: fmtDur(left)});
  };
}
async function op(label, fn) {
  if (!st.conn) { toast(tr('noConn2'), true); return; }
  if (st.busy) { toast(tr('busy'), true); return; }
  setBusy(true);
  var p = progress(label);
  log('info', label);
  try { return await fn(p); }
  catch (e) { toast(errMsg(e), true); if (e && e.status) showStatus(e.status); throw e; }
  finally { setBusy(false); $('rfflProg').hidden = true; }
}
function quiet(p) { return p.catch(function () {}); }

/* ---------- stato del drive ---------- */
function showStatus(s) {
  var el = $('rfflDstat');
  el.textContent = s.text;
  el.className = 'dstat' + (s.code >= 20 && s.code !== 73 ? ' err' : s.code < 2 ? ' ok' : '');
  // come un 1541 vero: il LED rosso lampeggia finché c'è un errore nel canale 15
  $('rfflLed').classList.toggle('err', s.code >= 20 && s.code !== 73 && s.code !== 99);
}
function updateButtons() {
  var c = !!st.conn, b = st.busy;

  $('rfflWrD').disabled = !c || b || !st.img;
  $('rfflWrAll').disabled = !c || b;
  $('rfflDev').disabled = b;
  $('rfflPwr').classList.toggle('on', c);
  if (!c) $('rfflLed').classList.remove('err');

function emuActivity(a) {

/* ---------- firmware del Pro Micro ---------- */
function toHex(bin) {
  var out = [];
  for (var a = 0; a < bin.length; a += 16) {
    var n = Math.min(16, bin.length - a), rec = [n, a >> 8, a & 255, 0], line = ':';
    for (var i = 0; i < n; i++) rec.push(bin[a + i]);
    var sum = rec.reduce(function (x, y) { return x + y; }, 0);
    rec.push((256 - (sum & 255)) & 255);
    rec.forEach(function (b) { line += b.toString(16).toUpperCase().padStart(2, '0'); });
    out.push(line);
  }
  out.push(':00000001FF');
  return out.join('\r\n') + '\r\n';
}

    buttons: [{v: 'src', label: tr('fwSrc')}, {v: 'dl', label: tr('fwDl')}, {v: 'go', label: tr('fwGo'), cls: 'pri'}]});
  if (!r) return;

  var out = $('rfflCsOut'), m = /(?:release\/\?id=|^)(\d+)\s*$/.exec(q.trim());
  if (m) return csRelease(m[1]);
  out.innerHTML = '<p class="none">' + esc(tr('csLoading')) + '</p>';
  try {
    var j = await (await csFetch({a: 'search', q: q})).json();
    if (j.release) return csRelease(j.release);
    if (!j.results || !j.results.length) { out.innerHTML = '<p class="none">' + esc(tr('csNone', {q: q})) + '</p>'; return; }
    out.innerHTML = '<p class="csnote">' + esc(tr('csN', {n: j.results.length})) + '</p><div class="csres">' + j.results.map(function (r) {
      return '<button class="hit" type="button" data-id="' + r.id + '"><b>' + esc(r.name) + '</b><span>' + esc(r.type || '') + (r.group ? ' · ' + esc(tr('csBy', {g: r.group})) : '') + '</span><em>' + esc(r.date || '') + '</em></button>';
    }).join('') + '</div>';
  } catch (e) { out.innerHTML = '<p class="none">' + esc(e.message) + '</p>'; }
}
async function csRelease(id) {
  var out = $('rfflCsOut');
  out.innerHTML = '<p class="none">' + esc(tr('csLoading')) + '</p>';
  try {
    var r = await (await csFetch({a: 'release', id: id})).json();
    var h = '<div class="rel">' + (r.screenshot ? '<img src="' + esc(r.screenshot) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '<div></div>') + '<div><h4>' + esc(r.name) + '</h4><div class="meta">' +
      esc([r.type, r.group ? tr('csBy', {g: r.group}) : '', r.year].filter(Boolean).join(' · ')) + ' · <a href="https://csdb.dk/release/?id=' + (+r.id) + '" target="_blank" rel="noopener">' + esc(tr('csPage')) + '</a></div><div class="dls">';
    if (!r.links || !r.links.length) h += '<p class="none">' + esc(tr('csNoDl')) + '</p>';
    (r.links || []).forEach(function (l) {
      h += '<div class="dl"><code>' + esc(l.file) + '</code><small>' + esc(tr('csDl', {n: l.downloads || 0})) + '</small>' +
        (l.internal ? '<button class="btn sm pri" type="button" data-dl="' + (+l.id) + '" data-fn="' + esc(l.file) + '">' + esc(tr('csOpen')) + '</button>' : '<a href="' + esc(l.url) + '" target="_blank" rel="noopener nofollow" title="' + esc(tr('csOnly')) + '">' + esc(tr('csExt')) + '</a>') + '</div>';
    });
    out.innerHTML = h + '</div></div></div>';
  } catch (e) { out.innerHTML = '<p class="none">' + esc(e.message) + '</p>'; }
}
async function csDownload(dlId, fname, btn) {
  btn.disabled = true; toast(tr('csGetting', {n: fname}));
  try {
    var r = await csFetch({a: 'file', id: dlId});
    var name = r.headers.get('X-Filename') || fname, data = new Uint8Array(await r.arrayBuffer());
    log('info', 'CSDb: ' + name + ' (' + data.length + ' byte)');
    await addEntries([{name: name, data: data}], tr('fromCsdb'));
  } catch (e) { toast(e.message, true); }
  btn.disabled = false;
}

/* ---------- schede ---------- */
function showTab(t) {
  root.querySelectorAll('#rfflPc .tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === t ? 'true' : 'false'); });
  $('rfflPFiles').hidden = t !== 'files'; $('rfflPImg').hidden = t !== 'img'; $('rfflPCsdb').hidden = t !== 'csdb'; $('rfflPLog').hidden = t !== 'log';
  if (t === 'log') logEl.scrollTop = logEl.scrollHeight;
  if (t === 'img') renderImage();
}

/* ---------- trascinamento ---------- */
function dropZone(el, onFiles) {
  var n = 0;
  el.addEventListener('dragenter', function (e) { if (!e.dataTransfer.types.includes('Files')) return; e.preventDefault(); n++; el.classList.add('over'); });
  el.addEventListener('dragover', function (e) { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
  el.addEventListener('dragleave', function () { if (--n <= 0) { n = 0; el.classList.remove('over'); } });
  el.addEventListener('drop', function (e) {
    e.preventDefault(); n = 0; el.classList.remove('over');
    if (e.dataTransfer.files.length) onFiles(e.dataTransfer.files);
  });
}

/* ---------- collegamento degli eventi ---------- */
function wire() {
  root.querySelectorAll('.modes button').forEach(function (b) {
    b.addEventListener('click', async function () {
      if (st.busy || b.dataset.m === st.mode) return;
      setMode(b.dataset.m);
      if (b.dataset.m === 'sim') connectSim();
      else { await disconnect(); if (st.knownUsb) $('rfflUsbAgain').hidden = false; if (st.lastSerial && RF.SerialLink.supported()) $('rfflEmuAgain').hidden = false; }
      renderFlag();
    });
  });
  $('rfflUsbGo').onclick = function () { connectUsb(null); };
  $('rfflSerGo').onclick = function () { connectSerial(null); };
  $('rfflUsbAgain').onclick = function () { connectUsb(st.knownUsb); };
  $('rfflUsbOff').onclick = function () { disconnect(); $('rfflUsbNote').innerHTML = tr('usbIdle'); };
  $('rfflSimModel').onchange = connectSim;
  $('rfflSimDisk').onchange = async function () {
    var c = st.conn; if (!c || !c.fake || st.busy) return;
    var d = simDisk(c.fake.model, this.value);
    if (d) c.fake.insert(d); else c.fake.eject();
    if (d) await refreshDir(); else { st.dir = null; renderDrive(); showStatus({code: 74, text: '74,DRIVE NOT READY,00,00'}); }
  };
  $('rfflSimSpeed').onchange = function () { if (st.conn && st.conn.fake) st.conn.fake.speed = this.value; };
  $('rfflSimWp').onchange = function () { if (st.conn && st.conn.fake) st.conn.fake.writeProtect = this.checked; };
  $('rfflSimDl').onclick = function () { var f = st.conn && st.conn.fake; if (f && f.disk) saveBytes('drive-simulato-' + f.model + '.' + f.disk.fmt.id, f.disk.data); };
  $('rfflDev').onchange = function () {
    if (!st.conn) return;
    st.conn.drive.dev = +this.value; st.conn.drive.model = '';
    if (st.conn.fake) st.conn.fake.dev = +this.value;
    if (st.conn.emu) { st.conn.emu.c64.dev = st.conn.emu.host.dev = +this.value; st.conn.emu.host.configure(); }
    st.dir = null; renderDrive();
    op(tr('opSt'), function () { return st.conn.drive.status(); }).then(function (s) {
      showStatus(s); st.conn.drive.setModel(s);
      if (!s.none) refreshDir();
      else { toast(tr('notPresent', {0: st.conn.drive.dev}), true); if (st.conn.xum.diag) st.conn.xum.diag().then(function (t) { log('err', t); }); }
    }, function () {});
  };
  $('rfflSt').onclick = function () { op(tr('opSt'), function () { return st.conn.drive.status(); }).then(showStatus, function () {}); };
  $('rfflId').onclick = function () { op(tr('opId'), function () { return st.conn.drive.identify(); }).then(function (s) { showStatus(s); renderDrive(); }, function () {}); };
  $('rfflRst').onclick = function () {
    op(tr('opRst'), async function () { await st.conn.cbm.exclusive(function () { return st.conn.cbm.reset(); }); await RF.util.sleep(st.conn.fake ? 100 : 2000); return st.conn.drive.status(6000); })
      .then(function (s) { showStatus(s); st.conn.drive.setModel(s); }, function () {});
  };
  $('rfflDir').onclick = refreshDir;
  $('rfflFmt').onclick = async function () {
    var c = st.conn, cur = st.dir ? S(st.dir.name) : '';
    var r = await ask({title: tr('fmtT'), body: tr('fmtB'), fields: [{id: 'n', label: tr('fName'), value: cur || 'RETROFIXER', max: 16}, {id: 'i', label: tr('fId'), value: '01', max: 2}, {id: 'q', type: 'check', label: tr('fQuick')}], ok: tr('bFmtGo'), danger: true});
    if (!r || !r.n.trim()) return;
    try { var s = await op(tr('opFmt'), function () { return c.drive.format(pet.fromStr(r.n).slice(0, 16), r.q ? null : pet.fromStr(r.i || '01').slice(0, 2)); }); showStatus(s); } catch (e) {}
    await refreshDir();
  };
  $('rfflVal').onclick = async function () {
    var c = st.conn;
    if (!(await ask({title: tr('valT'), body: tr('valB'), ok: tr('bValGo')}))) return;
    try { var s = await op(tr('opVal'), function () { return c.drive.validate(); }); showStatus(s); } catch (e) {}
    await refreshDir();
  };
  $('rfflCmd').onclick = function () {
    var c = st.conn, changed = false;
    ask({title: tr('cmdT'), body: tr('cmdB'), fields: [{id: 'c', label: tr('cmdF'), value: 'I0', max: 58}], ok: tr('bSend'), cancel: tr('close'),
      onSubmit: async function (v, out) {
        if (!v.c.trim()) return;
        out.textContent = '…'; out.className = 'out';
        try {
          var s = await op(v.c, function () { return c.drive.command(pet.fromStr(v.c), 30000); });
          out.textContent = s.text; out.className = 'out' + (s.code >= 20 && s.code !== 73 ? ' err' : ''); showStatus(s); changed = true;
          if (s.code === 73) c.drive.setModel(s);
        } catch (e) { out.textContent = errMsg(e); out.className = 'out err'; }
      }}).then(function () { if (changed) refreshDir(); });
  };
  $('rfflRdD').onclick = readDiskDlg;
  $('rfflEmuGo').onclick = function () { connectEmu(null); };
  $('rfflEmuAgain').onclick = function () { connectEmu(st.lastSerial); };
  $('rfflEmuOff').onclick = function () { disconnect(); $('rfflEmuNote').innerHTML = tr('emuIdle'); };
  $('rfflEmuDl').onclick = function () { var c = st.conn; if (c && c.emu) saveBytes('disco-emulato.' + c.emu.c64.disk.fmt.id, c.emu.c64.disk.data); };
  $('rfflEmuDisk').onchange = async function () { if (!st.conn || !st.conn.emu || st.busy) return; emuInsert(emuDisk(this.value)); await refreshDir(); };
  $('rfflFw1').onclick = firmwareDlg; $('rfflFw2').onclick = firmwareDlg;
  $('rfflSep').onclick = driveSeparator;
  $('rfflFlag').addEventListener('click', function (ev) { if (ev.target.closest('[data-try=sim]')) { setMode('sim'); connectSim(); } });
  $('rfflWrD').onclick = writeDiskDlg;
  $('rfflStop').onclick = function () { if (st.conn) st.conn.cbm.stop(); };

  root.querySelectorAll('#rfflPc .tabs button').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });
  $('rfflPick').onclick = function () { $('rfflInp').click(); };
  $('rfflPickDir').onclick = pickFolder;
  $('rfflInp').onchange = function () { readFiles(this.files, ''); this.value = ''; };
  $('rfflInpDir').onchange = function () { var fl = Array.prototype.filter.call(this.files, function (f) { return EXT_OK.test(f.name); }).slice(0, 400); readFiles(fl, ''); this.value = ''; };
  dropZone($('rfflDrop'), function (fl) { readFiles(fl, ''); });
  dropZone($('rfflDrv'), async function (fl) {
    var added = await readFiles(fl, '');
    var toWrite = added.filter(function (f) { return f.kind === 'file'; });
    if (toWrite.length && st.conn) await writeAll(toWrite);
  });
  $('rfflList').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-a]'); if (!b) return;
    var f = fileById(+b.closest('.fitem').dataset.id); if (!f) return;
    if (b.dataset.a === 'rm') { st.files.splice(st.files.indexOf(f), 1); renderFiles(); }
    else if (b.dataset.a === 'open') { openImage(f.disk, f.pc); showTab('img'); }
    else if (b.dataset.a === 'wr') writeToDrive(f);
  });
  $('rfflList').addEventListener('change', function (ev) {
    var t = ev.target, f = fileById(+t.closest('.fitem').dataset.id); if (!f) return;
    if (t.dataset.a === 'nm') { var p = pet.fromStr(t.value).slice(0, 16); if (p.length) f.c64 = p; t.value = S(f.c64); }
    if (t.dataset.a === 'ty') f.type = t.value;
  });
  $('rfflWrAll').onclick = function () { writeAll(st.files.filter(function (f) { return f.kind === 'file'; })); };
  $('rfflClr').onclick = function () { st.files = []; renderFiles(); };
  $('rfflPImg').addEventListener('click', function (ev) { var b = ev.target.closest('[data-v]'); if (b && !b.disabled) imgTool(b.dataset.v); });
  $('rfflCsF').onsubmit = function (ev) { ev.preventDefault(); var q = $('rfflCsQ').value.trim(); if (q) csSearch(q); };
  $('rfflCsOut').addEventListener('click', function (ev) {
    var h = ev.target.closest('.hit'); if (h) { csRelease(h.dataset.id); return; }
    var d = ev.target.closest('[data-dl]'); if (d) csDownload(d.dataset.dl, d.dataset.fn, d);
  });
  $('rfflLogBus').onchange = function () { logEl.classList.toggle('nobus', !this.checked); };
  $('rfflLogCp').onclick = function () { navigator.clipboard.writeText(logLines.join('\n')).then(function () { toast(tr('copied')); }); };
  $('rfflLogClr').onclick = function () { logLines = []; logEl.innerHTML = ''; };
}

/* ---------- avvio ---------- */
$('rfflStats').innerHTML = [RF.Xum1541.supported() ? tr('stUsb') : tr('stUsbNo'), RF.SerialLink.supported() ? tr('stSer') : tr('stSerNo'), HAS_FS ? tr('stFs') : tr('stFsNo'), tr('stFmt')].join(' · ');
wire();
usbInit();
emuInit();
renderFiles(); renderImage(); renderDrive(); updateButtons();
// con WebUSB si parte dal drive reale (scollegato); senza, solo la simulazione ha senso
var m0 = RF.Xum1541.supported() ? 'usb' : 'sim';
try { m0 = localStorage.getItem('rfflMode') || m0; } catch (e) {}
if (m0 === 'usb' && RF.Xum1541.supported()) { setMode('usb'); renderDrive(); }
else if (m0 === 'emu' && RF.SerialLink.supported()) { setMode('emu'); renderDrive(); }
else { setMode('sim'); connectSim(); }
})(window.RFFloppy = window.RFFloppy || {});
</script>
