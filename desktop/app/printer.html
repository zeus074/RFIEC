<style>
@font-face{font-family:'Inter';src:url(fonts/Inter.ttf) format('truetype');font-weight:100 900}
@font-face{font-family:'Press Start 2P';src:url(fonts/PressStart2P.ttf) format('truetype')}
@font-face{font-family:'VT323';src:url(fonts/VT323.ttf) format('truetype')}
html,body{margin:0;background:#0f0c24}
.rffl{min-height:100vh;box-sizing:border-box}
.rffl .head h2,.rffl .head>p{display:none}
.rffl{padding-top:12px!important}
.rffl .head .stats{margin-top:0}
.rffl{--bg:#0f0c24;--bg2:#171338;--panel:#1d1846;--line:#342c74;--text:#eceaff;--muted:#aaa5d8;--c64l:#7c70da;--c64b:#40318d;--mag:#e0398a;--yel:#ffd23f;--grn:#5ad15f;--cya:#3fd8ff;--red:#f94144;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:var(--bg);line-height:1.55;padding:36px 0 28px}
.rffl *,.rffl *::before,.rffl *::after{box-sizing:border-box}
.rffl h2,.rffl h3,.rffl h4,.rffl p,.rffl ul,.rffl ol{margin:0;padding:0}
.rffl h2,.rffl h3,.rffl h4{font-family:'Inter',system-ui,sans-serif!important;letter-spacing:0;text-transform:none;font-weight:700;color:var(--text)}
.rffl a{color:var(--cya)}
.rffl button,.rffl input,.rffl select{font:inherit;color:inherit}
.rffl button{cursor:pointer}
.rffl button:disabled{cursor:not-allowed;opacity:.45}
.rffl [hidden]{display:none!important}
.rffl .wrap{max-width:1400px;margin:0 auto;padding:0 16px}
.rffl .head h2{font-family:'Press Start 2P',monospace!important;font-size:clamp(17px,3vw,27px);line-height:1.45;color:var(--yel);margin-bottom:12px}
.rffl .head p{color:var(--muted);max-width:900px;font-size:16px}
.rffl .head .stats{font-family:'VT323',monospace;font-size:19px;color:var(--c64l);margin-top:8px}
.rffl .head .stats b{color:var(--grn);font-weight:400}
.rffl .head .stats i{color:var(--red);font-style:normal}

/* pulsanti */
.rffl .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:7px 12px;font-size:14px;line-height:1.3;white-space:nowrap}
.rffl .btn:hover:not(:disabled){background:var(--line);color:#fff}
.rffl .btn.pri{background:var(--grn);border-color:var(--grn);color:#0f0c24;font-weight:700}
.rffl .btn.pri:hover:not(:disabled){background:#7be27f;color:#0f0c24}
.rffl .btn.rf{background:#ff8a1f;border-color:#ff8a1f;color:#1d1000;font-weight:700}
.rffl .btn.rf:hover:not(:disabled){background:#ffa552;border-color:#ffa552;color:#1d1000}
.rffl .btn.rf .onl{display:none}
.rffl .btn.rf.on{background:#ffe0bf;border-color:#ffb36b;color:#5a2e00;opacity:1;cursor:default}
.rffl .btn.rf.on .onl{display:inline}.rffl .btn.rf.on .offl{display:none}
.rffl .btn.warn{border-color:var(--mag);color:#ff9ccc}
.rffl .btn.warn:hover:not(:disabled){background:var(--mag);color:#fff}
.rffl .btn.sm{padding:4px 9px;font-size:13px;border-radius:6px}
.rffl .btn .i{font-size:15px;line-height:1}
.rffl input[type=text],.rffl input[type=search],.rffl select{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:14px;outline:none}
.rffl input[type=text]:focus,.rffl input[type=search]:focus,.rffl select:focus{border-color:var(--c64l)}
.rffl select option{background:var(--bg2)}
.rffl label.ck{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);cursor:pointer}
.rffl label.ck input{accent-color:var(--grn);width:16px;height:16px}

/* collegamento */
.rffl .conn{margin:22px 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.rffl .modes{display:flex;border-bottom:1px solid var(--line);background:#2a2a31;border-radius:10px 10px 0 0;overflow:hidden}
.rffl .modes button{flex:1;background:#2a2a31;border:0;border-right:1px solid #3d3d47;border-bottom:3px solid transparent;cursor:pointer;transition:background .15s;padding:12px 10px 10px;font-size:15px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.rffl .modes button:last-child{border-right:0}
.rffl .modes button small{font-weight:400;font-size:12.5px;color:#a9a9b6}
.rffl .modes button{color:#cfcfd8}
.rffl .modes button[aria-selected=true]{color:#fff;border-bottom-color:var(--yel);background:var(--panel)}
.rffl .modes button[aria-selected=true] small{color:#d6d2ff}
.rffl .modes button .ico{font-style:normal;font-size:13px;font-weight:700;letter-spacing:.5px;color:#a9a9b6;opacity:.75;margin-bottom:2px;white-space:nowrap}
.rffl .modes button[aria-selected=true] .ico{opacity:1;color:#fff}
.rffl .modes button:not([aria-selected=true]):hover{color:#fff;background:#383842}
.rffl .cbody{padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.rffl .cbody .note{flex:1 1 100%;font-size:14px;color:var(--muted)}
.rffl .cbody .note b{color:var(--text)}
.rffl .cbody .note.err{color:#ffb3b4}
.rffl .fld{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted)}
.rffl details.help{flex:1 1 100%;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.rffl details.help summary{cursor:pointer;color:var(--cya);font-weight:600}
.rffl details.help ul{margin:8px 0 0 18px}
.rffl details.help li{margin:3px 0}
.rffl details.help code,.rffl .cbody code,.rffl .credits code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--bg2);padding:0 4px;border-radius:3px;color:var(--yel)}
.rffl .devrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--bg2);border-radius:0 0 10px 10px}
/* frontalino del drive con i due LED, come un 1541 vero */
.rffl .mini1541{position:relative;width:96px;height:38px;flex:none;background:linear-gradient(#ebe4cd,#d2c9ab 70%,#bfb593);border:1px solid #8f866c;border-radius:4px 4px 5px 5px;box-shadow:inset 0 1px 0 #faf6e8,0 3px 6px #0008}
.rffl .mini1541::before{content:'';position:absolute;left:6px;right:6px;top:4px;height:3px;background:repeating-linear-gradient(90deg,#b8ae8c 0 4px,transparent 4px 7px);opacity:.8}
.rffl .mini1541 .slot{position:absolute;left:7px;right:7px;top:11px;height:9px;background:#151312;border-radius:2px;box-shadow:inset 0 2px 3px #000,0 1px 0 #f3eddb}
.rffl .mini1541 .pwr,.rffl .mini1541 .led{position:absolute;bottom:6px;width:12px;height:5px;border-radius:1px;border:1px solid #5d5645;box-shadow:inset 0 1px 1px #0008}
.rffl .mini1541 .pwr{left:9px;bottom:5px;width:8px;height:8px;border-radius:50%;background:#24401f}
.rffl .mini1541 .led{left:22px;width:14px;background:#4a1d1a}
.rffl .mini1541 .pwr.on{background:#6cf06a;box-shadow:0 0 6px #5ad15f,0 0 1px #fff inset}
.rffl .mini1541 .led.on{background:#ff3b30;box-shadow:0 0 7px #f94144,0 0 1px #fff inset}
.rffl .mini1541 .led.err{animation:rfflerr .5s steps(1) infinite}
@keyframes rfflerr{0%{background:#ff3b30;box-shadow:0 0 7px #f94144}50%{background:#4a1d1a;box-shadow:none}}
.rffl .led{width:14px;height:14px;border-radius:50%;background:#3a1416;border:1px solid #000;box-shadow:inset 0 0 3px #000;flex:none}
.rffl .led.on{background:var(--red);box-shadow:0 0 8px var(--red),0 0 2px #fff inset}
.rffl .pwr{width:14px;height:14px;border-radius:3px;background:#173a19;border:1px solid #000;flex:none}
.rffl .pwr.on{background:var(--grn);box-shadow:0 0 7px var(--grn)}
.rffl .dstat{font-family:'VT323',monospace;font-size:20px;color:var(--c64l);min-width:0;overflow-wrap:anywhere}
.rffl .dstat.err{color:var(--red)}
.rffl .dstat.ok{color:var(--grn)}
.rffl .devrow .sp{flex:1}

/* layout */
.rffl .main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.rffl .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;position:relative}
.rffl .phead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.rffl .phead h3{font-size:17px!important;color:var(--yel)!important}
.rffl .phead .sub{font-size:13.5px;color:var(--muted)}
.rffl .tools{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
.rffl .tools .sep{flex:1}
.rffl .pbody{padding:0 14px 14px}

/* indicatore drive reale / simulazione */
.rffl .mflag{margin:10px 14px 0;border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.45;border:1px solid var(--line);background:var(--bg2);color:var(--muted)}
.rffl .mflag b{font-family:'VT323',monospace;font-size:21px;font-weight:400;margin-right:6px;letter-spacing:.03em}
.rffl .mflag .btn{margin-left:6px;vertical-align:middle}
.rffl .mflag.on{border-color:var(--grn);background:#12301f;color:#c9f5cb}
.rffl .mflag.on b{color:var(--grn)}
.rffl .mflag.off{border-color:#5a5390}
.rffl .mflag.off b{color:#ff8c8e}
.rffl .mflag.sim{border:1px dashed var(--mag);background:repeating-linear-gradient(135deg,#2a1438 0 14px,#24113a 14px 28px);color:#ffd0e6}
.rffl .mflag.sim b{color:var(--yel)}
.rffl .mflag.emu{border-color:var(--cya);background:#10283e;color:#cdeeff}
.rffl .mflag.emu b{color:var(--cya)}
.rffl .mflag .eprog{display:flex;align-items:center;gap:10px;margin-top:4px;font-family:'VT323',monospace;font-size:18px;color:#cdeeff}
.rffl .mflag .eprog .bar{flex:0 0 160px;height:10px;border:1px solid var(--cya);background:#0a1a29;border-radius:2px;overflow:hidden}
.rffl .mflag .eprog .bar i{display:block;height:100%;background:var(--cya);transition:width .25s linear}
.rffl .mflag .last{display:block;font-family:'VT323',monospace;font-size:19px;color:var(--yel);margin-top:3px;overflow-wrap:anywhere}
.rffl .panel[data-mode=emu]{border-color:var(--cya);box-shadow:0 0 0 1px #1f5a7a inset}
.rffl .modes button[data-m=emu][aria-selected=true]{border-bottom-color:var(--cya)}
.rffl .log .k-c64{color:#ff9ccc}
.rffl .panel[data-mode=on]{border-color:var(--grn);box-shadow:0 0 0 1px #2c6a34 inset}
.rffl .panel[data-mode=sim]{border-style:dashed;border-color:var(--mag)}
.rffl .modes button[data-m=usb][aria-selected=true]{border-bottom-color:var(--grn)}
.rffl .modes button[data-m=sim][aria-selected=true]{border-bottom-color:var(--mag)}

/* avanzamento */
.rffl .prog{margin:0 14px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.rffl .prog .top{display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:6px}
.rffl .prog .top span{flex:1;min-width:0}
.rffl .prog .bar{height:10px;background:#0b0920;border-radius:5px;overflow:hidden}
.rffl .prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c64l),var(--cya));transition:width .2s}
.rffl .prog .bar.ind i{width:30%!important;animation:rfflind 1.2s linear infinite}
@keyframes rfflind{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.rffl .prog .eta{font-family:'VT323',monospace;font-size:18px;color:var(--c64l);margin-top:4px}

/* schermo C64 */
.rffl .scr{background:var(--c64b);border:12px solid var(--c64l);border-radius:6px;padding:8px 0;font-family:'VT323',monospace;font-size:21px;line-height:1.05;color:#a8a0ff;min-height:180px;max-height:560px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--c64l) var(--c64b)}
.rffl .scr .ln{display:flex;align-items:center;gap:8px;padding:1px 10px;white-space:pre;min-height:24px}
.rffl .scr .ln .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rffl .scr .hdr .tx span{background:#a8a0ff;color:var(--c64b)}
.rffl .scr .row{cursor:pointer;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit}
.rffl .scr .row:hover,.rffl .scr .row:focus-visible{background:#5546a8;outline:none}
.rffl .scr .row.sel{background:#a8a0ff;color:var(--c64b)}
.rffl .scr .row .acts{display:none;gap:4px;flex:none}
.rffl .scr .row:hover .acts,.rffl .scr .row.sel .acts,.rffl .scr .row:focus-within .acts{display:flex}
.rffl .scr .acts span{font-family:'Inter',system-ui,sans-serif;font-size:12.5px;line-height:1.2;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.rffl .scr .acts span:hover{background:var(--yel);color:#1a1440;border-color:var(--yel)}
.rffl .scr .acts span.del:hover{background:var(--red);color:#fff;border-color:var(--red)}
.rffl .scr .empty{padding:10px;color:#a8a0ff;white-space:normal}
.rffl .scr .cur{display:inline-block;width:.55em;height:.9em;background:#a8a0ff;vertical-align:-2px;animation:rfflblink 1s steps(1) infinite}
@keyframes rfflblink{50%{opacity:0}}
.rffl .drophint{margin-top:10px;border:2px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--muted);text-align:center}
.rffl .panel.over{outline:3px solid var(--yel);outline-offset:-3px}
.rffl .panel.over .drophint{border-color:var(--yel);color:var(--yel)}

/* schede del pannello PC */
.rffl .tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:#2a2a31;border-radius:10px 10px 0 0}
.rffl .tabs button{flex:1 0 auto;background:#2a2a31;border:0;border-right:1px solid #3d3d47;border-bottom:3px solid transparent;padding:12px 12px 9px;font-size:14px;font-weight:600;color:#cfcfd8;cursor:pointer;transition:background .15s}
.rffl .tabs button:last-child{border-right:0}
.rffl .tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--yel);background:var(--panel)}
.rffl .tabs button:not([aria-selected=true]):hover{color:#fff;background:#383842}
.rffl .tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--line);font-size:11.5px;color:var(--text)}
.rffl .pane{padding:14px}
.rffl .drop{border:2px dashed var(--line);border-radius:10px;padding:18px 14px;text-align:center;color:var(--muted);font-size:14.5px;transition:border-color .15s,background .15s}
.rffl .drop.over{border-color:var(--yel);background:#2a2366;color:#fff}
.rffl .drop .big{font-size:16px;color:var(--text);font-weight:600;margin-bottom:4px}
.rffl .drop .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.rffl .flist{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.rffl .fitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rffl .fitem .ty{font-family:'VT323',monospace;font-size:18px;color:#1a1440;background:var(--c64l);border-radius:4px;padding:0 6px;text-align:center;min-width:44px}
.rffl .fitem .ty.img{background:var(--yel)}
.rffl .fitem .ty.seq{background:var(--cya)}
.rffl .fitem .nm{min-width:0}
.rffl .fitem .nm b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rffl .fitem .nm small{font-size:12.5px;color:var(--muted)}
.rffl .fitem .c64{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.rffl .fitem .c64 input{font-family:'VT323',monospace;font-size:18px;padding:2px 8px;width:15em;max-width:100%;text-transform:uppercase}
.rffl .fitem .c64 select{padding:3px 6px;font-size:13px}
.rffl .fitem .fa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rffl .listbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:13.5px;color:var(--muted)}
.rffl .listbar .sp{flex:1}
.rffl .none{color:var(--muted);padding:14px 4px;font-size:14.5px}

/* visualizzatore immagine */
.rffl .vhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:10px}
.rffl .vhead b{font-size:15px}
.rffl .vhead span{font-size:13.5px;color:var(--muted)}
.rffl .vtools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rffl .bam{margin-top:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px}
.rffl .bam h4{font-size:13px!important;font-weight:600;color:var(--muted);text-transform:uppercase!important;letter-spacing:.06em!important;margin-bottom:8px}
.rffl .bam canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:crosshair}
.rffl .bam .leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.rffl .bam .leg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rffl .bam .tip{font-family:'VT323',monospace;font-size:18px;color:var(--cya);min-height:22px;margin-top:4px}
.rffl .detail{margin-top:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px}
.rffl .detail .dh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:8px}
.rffl .detail .dh b{font-family:'VT323',monospace;font-size:22px;color:var(--yel);font-weight:400}
.rffl .detail .dh span{font-size:13.5px;color:var(--muted)}
.rffl .detail .dh .sp{flex:1}
.rffl .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rffl .seg button{background:var(--bg2);border:0;padding:5px 11px;font-size:13px;color:var(--muted)}
.rffl .seg button+button{border-left:1px solid var(--line)}
.rffl .seg button[aria-pressed=true]{background:var(--line);color:#fff}
.rffl pre.code{font-family:'VT323',monospace;font-size:19px;line-height:1.15;background:var(--c64b);color:#a8a0ff;border:1px solid #6c5eb5;border-radius:6px;padding:10px 12px;margin:8px 0 0;max-height:420px;overflow:auto;white-space:pre;scrollbar-width:thin}
.rffl pre.hex{font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:12.5px;line-height:1.45;background:#0b0920;color:#cfcbef;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0 0;max-height:420px;overflow:auto;white-space:pre}
.rffl pre.hex i{color:var(--c64l);font-style:normal}
.rffl pre.hex u{color:var(--muted);text-decoration:none}

/* CSDb */
.rffl .csform{display:flex;gap:8px}
.rffl .csform input{flex:1;min-width:0}
.rffl .csnote{font-size:13px;color:var(--muted);margin-top:8px}
.rffl .csres{margin-top:12px;display:flex;flex-direction:column}

qv///////////////////////////////////////////////////////////////////////////////////w=="}}; RF.FIRMWARE_SRC = {"rfiec.ino": "// RetroFixer RFIEC \u2013 il PC fa da drive (e da stampante) per il Commodore 64, oppure comanda drive e stampanti veri\n// ---------------------------------------------------------------------------\n// Firmware per Arduino Pro Micro (ATmega32U4, 5 V / 16 MHz) collegato al bus seriale IEC\n// con gli stessi fili della XUM1541 \"PROMICRO\" (nessun componente in pi\u00f9):\n//\n//   Pro Micro   segnale   pin DIN IEC\n//   16 (PB2)    DATA      5\n//   14 (PB3)    CLK       4\n//    8 (PB4)    ATN       3\n//    9 (PB5)    SRQ       1\n//   10 (PB6)    RESET     6   (letto come dispositivo, tirato a zero dal reset in modalit\u00e0 padrone)\n//   GND         GND       2\n//\n// Il Pro Micro fa la parte del DISPOSITIVO (drive o stampante): i tempi del bus li gestisce la\n// libreria IECDevice di David Hansel (GPL-3, https://github.com/dhansel/IECDevice); il firmware\n// passa al browser ogni evento del bus (LISTEN, TALK, dati, UNLISTEN, UNTALK) attraverso la seriale\n// USB, e il browser risponde con i dati del disco (il \"DOS\" sta nella pagina web).\n//\n// Dalla versione 2.0 c'\u00e8 anche la modalit\u00e0 PADRONE DEL BUS (comando 'M' 1): il Pro Micro fa quello che fa la XUM1541,\n// cio\u00e8 comanda il bus al posto del C64 (LISTEN, TALK, dati, UNLISTEN, UNTALK) per leggere e scrivere sui drive veri o\n// stampare su una stampante vera. I tempi sono quelli del bus seriale Commodore; il codice \u00e8 scritto qui da zero.\n//\n// Protocollo (binario, sulla seriale USB; la velocit\u00e0 impostata non conta):\n//   PC \u2192 Pro Micro\n//     'V'                              chiede la versione \u2192 risposta 'H'\n//     'C' slot dev flags               configura lo slot 0 (drive) o 1 (stampante): numero e attivazione (bit 0)\n//     'D' slot seq len flags dati[len] dati da mandare al C64 (len \u2264 64); flags bit0 = fine file, bit1 = nessun dato\n//     'F' slot loader proto            avvia un caricatore veloce riconosciuto dalla pagina (loader 2 = Final Cartridge III;\n//                                      proto 1 LOAD e 5 LOADIMG leggono il canale 0, 2 SAVE scrive sul canale 1;\n//                                      loader 1 = Epyx FastLoad, proto 3: il nome del file arriva dal caricatore)\n//     'M' modo                         0 = dispositivo (drive/stampante emulati), 1 = padrone del bus \u2192 risposta 'm' modo\n//   solo in modalit\u00e0 padrone del bus:\n//     'A' len flags byte[len]          byte sotto ATN (LISTEN/TALK/OPEN/CLOSE/UNLISTEN/UNTALK); flags bit0 = dopo c'\u00e8 un TALK:\n//                                      il PC diventa ascoltatore \u2192 risposta 'a' n err (byte accettati, 0 = nessun dispositivo;\n//                                      err: 0 bene, 1 nessuno tira DATA, 2 chi ascolta non si libera, 3 byte non confermato,\n//                                      4 il dispositivo non prende CLK dopo il TALK)\n//     'B' len flags byte[len]          dati per chi ascolta; flags bit0 = EOI sull'ultimo byte \u2192 risposta 'b' n\n//     'G' lo hi                        legge fino a lo+hi*256 byte da chi parla \u2192 risposte 'g' n flags byte[n] (n \u2264 60;\n//                                      flags bit0 = EOI ricevuto, bit1 = ultimo pezzo); si ferma dopo 1 s senza dati\n//     'X'                              RESET del bus (la linea RESET a zero per 100 ms) \u2192 risposta 'x'\n//     'S'                              misura delle linee \u2192 risposta 's' a b c d (porta B del 32U4: a = a riposo,\n//                                      b = a riposo con i pull-up interni, c = con ATN e CLK tirati dopo 1 ms,\n//                                      d = 100 ms dopo aver liberato tutto; bit 2 DATA, 3 CLK, 4 ATN, 6 RESET, 1 = alta)\n//   Pro Micro \u2192 PC\n//     'H' len testo                    versione del firmware\n//     'L' slot sec                     LISTEN con indirizzo secondario (0x6n dati, 0xEn CLOSE, 0xFn OPEN)\n//     'T' slot sec seq                 TALK (seq: numero della sessione di TALK)\n//     'U' slot                         UNLISTEN\n//     'K' slot seq lo hi               UNTALK: quanti byte il C64 ha letto davvero in questa sessione\n//     'W' slot len eoi dati[len]       byte mandati dal C64 (len \u2264 32)\n//     'Q' slot seq                     servono altri dati per il TALK in corso\n//     'R'                              la linea RESET del bus \u00e8 andata a zero\n//\n// Licenza: GPL-3.0 (come IECDevice).\n\n#include <Arduino.h>\n#include <util/delay.h>\n#include <IECDevice.h>\n#include <IECBusHandler.h>\n\n#define PIN_ATN    8\n#define PIN_CLK   14\n#define PIN_DATA  16\n#define PIN_RESET 10\n#define PIN_SRQ    9\n\n#define FW_VERSION \"RFIEC 2.6\"\n\n// Porta seriale aperta dal PC. NON usare \"(bool) Serial\" sul 32U4: contiene un delay(10), e la libreria\n// chiama isActive() mentre il C64 manda l'indirizzo sotto ATN (che va confermato entro 1 ms).\nstatic bool hostUp = false;\nstatic bool lineUp() { return Serial.dtr() || Serial.rts(); }\n\n// ---------------- coda verso il PC ----------------\n#define OQ_SIZE 256\nstatic uint8_t  oq[OQ_SIZE];\nstatic uint16_t oqHead = 0, oqTail = 0;\nstatic uint16_t oqUsed() { return (uint16_t)(oqHead - oqTail); }\nstatic uint16_t oqFree() { return OQ_SIZE - oqUsed(); }\nstatic bool oqPut(const uint8_t *b, uint8_t n)\n{\n  if( oqFree() < n ) return false;\n  for(uint8_t i=0; i<n; i++) oq[(oqHead++) % OQ_SIZE] = b[i];\n  return true;\n}\nstatic void oqPump()\n{\n  uint16_t n = oqUsed();\n  if( n==0 || !hostUp ) return;\n  int room = Serial.availableForWrite();\n  if( room <= 0 ) return;\n  uint8_t chunk[32];\n  uint8_t k = 0;\n  while( k < sizeof(chunk) && k < (uint16_t) room && k < n ) chunk[k++] = oq[(oqTail++) % OQ_SIZE];\n  Serial.write(chunk, k);\n}\n\n// ---------------- padrone del bus (come la XUM1541) ----------------\n// Linee open collector sulla porta B: \"tirata\" = uscita a zero, \"libera\" = ingresso senza pull-up (le resistenze\n// le hanno il drive e la stampante). Le attese brevi si fanno a interrupt spenti e si contano in microsecondi.\n#define LN_DATA _BV(2)   // PB2 = pin 16\n#define LN_CLK  _BV(3)   // PB3 = pin 14\n#define LN_ATN  _BV(4)   // PB4 = pin 8\n#define LN_RST  _BV(6)   // PB6 = pin 10\nstatic bool master = false;\nstatic inline void lnLow(uint8_t m)  { PORTB &= ~m; DDRB |= m; }\nstatic inline void lnFree(uint8_t m) { DDRB &= ~m; PORTB &= ~m; }\nstatic inline bool lnIsLow(uint8_t m) { return (PINB & m) == 0; }\nstatic void lnFreeAll() { lnFree(LN_DATA | LN_CLK | LN_ATN | LN_RST); }\n// attesa breve (interrupt spenti): vero se la linea arriva allo stato voluto entro us microsecondi\n// (delayMicroseconds(1) sul 16 MHz non aspetta quasi niente: si usa _delay_us, un ciclo di attesa esatto)\nstatic bool waitShort(uint8_t m, bool low, uint16_t us)\n{\n  for( uint16_t n = 0; n < us; n++ ) { if( lnIsLow(m) == low ) return true; _delay_us(1); }\n  return lnIsLow(m) == low;\n}\nstatic uint8_t mErr = 0;\n// attesa lunga (interrupt accesi), in millisecondi; si interrompe se la pagina chiude la porta seriale\nstatic bool waitLong(uint8_t m, bool low, uint16_t ms)\n{\n  unsigned long t0 = millis();\n  uint8_t k = 0;\n  while( lnIsLow(m) != low )\n    {\n      if( millis() - t0 > ms ) return false;\n      if( ++k==0 && !(Serial.dtr() || Serial.rts()) ) return false;\n    }\n  return true;\n}\n// un byte da \"parlatore\": 0 = ricevuto, 1 = chi ascolta non \u00e8 pronto, 2 = nessuna conferma\nstatic uint8_t mSendByte(uint8_t b, bool eoi, uint16_t readyMs)\n{\n  lnFree(LN_CLK);                                   // pronto a mandare\n  if( !waitLong(LN_DATA, false, readyMs) ) { mErr = 2; return 1; }  // chi ascolta libera DATA quando \u00e8 pronto\n  noInterrupts();\n  if( eoi )\n    {\n      // EOI: si aspetta senza tirare CLK; chi ascolta lo conferma tirando DATA per almeno 60 us\n      if( !waitShort(LN_DATA, true, 2000) || !waitShort(LN_DATA, false, 2000) ) { interrupts(); return 2; }\n    }\n  lnLow(LN_CLK);\n  // tempi come nella XUM1541 di OpenCBM: CLK resta basso 75 us prima di ogni bit (il 1541 non regge i 20 us\n  // minimi delle specifiche), il bit si mette 2 us prima di liberare CLK e resta valido 20 us\n  for( uint8_t i = 0; i < 8; i++ )\n    {\n      delayMicroseconds(75);\n      if( !(b & 1) ) { lnLow(LN_DATA); _delay_us(2); }\n      lnFree(LN_CLK);                                 // bit valido\n      delayMicroseconds(20);\n      lnLow(LN_CLK);\n      lnFree(LN_DATA);\n      b >>= 1;\n    }\n  bool ack = waitShort(LN_DATA, true, 2000);        // conferma del byte (1 ms per le specifiche, si tollera il doppio)\n  interrupts();\n  delayMicroseconds(100);\n  if( !ack ) mErr = 3;\n  return ack ? 0 : 2;\n}\n// byte sotto ATN; talk: dopo l'ultimo il PC diventa ascoltatore (il dispositivo prende CLK)\nstatic uint8_t mAtn(const uint8_t *b, uint8_t n, bool talk)\n{\n  lnFree(LN_DATA); lnLow(LN_CLK); lnLow(LN_ATN);\n  mErr = 0;\n  // i dispositivi rispondono tirando DATA entro 1 ms (si aspetta fino a 2 ms, come la XUM1541)\n  if( !waitShort(LN_DATA, true, 2000) ) { lnFree(LN_ATN); lnFree(LN_CLK); mErr = 1; return 0; }   // nessun dispositivo\n  delayMicroseconds(40);\n  uint8_t sent = 0;\n  // un drive occupato (per esempio mentre legge la directory dopo un OPEN) risponde all'ATN solo quando ha finito:\n  // come la XUM1541 si aspetta che sia pronto (qui fino a 30 s)\n  while( sent < n && mSendByte(b[sent], false, 30000)==0 ) sent++;\n  if( sent < n ) { delayMicroseconds(20); lnFreeAll(); return sent; }   // byte non passato: si libera il bus\n  if( talk && sent==n )\n    {\n      // inversione dei ruoli: il PC tira DATA e libera ATN e CLK, poi il drive prende CLK quando ha finito di\n      // gestire l'ATN. Il 1541 ci mette alcuni millisecondi (il Kernal del C64 aspetta senza limite): fino a 100 ms.\n      lnLow(LN_DATA); delayMicroseconds(20); lnFree(LN_ATN); lnFree /* ---------- la carta ---------- */
var paperEl = $('rfstPaper'), canvases = [], drawQ = {}, drawT = 0;
var model0 = 'mps';

// drawQ[foglio] = righe da ridisegnare {from, to} (null = tutto il foglio)
var mps = new RF.Mps({model: model0, onChange: function (m, d) {
  if (!d) { paperEl.innerHTML = ''; canvases = []; drawQ = {}; renderSub(); return; }
  var H = m.H, spill = 6;    // i punti sul bordo di un foglio si vedono anche sul bordo di quello accanto
  for (var p = Math.floor((d.from - spill) / H); p <= Math.floor((d.to + spill) / H); p++) {
    if (p < 0) continue;
    var a = Math.max(0, d.from - spill - p * H), b = Math.min(H - 1, d.to + spill - p * H), q = drawQ[p];
    if (q === null || a > b) continue;
    drawQ[p] = q ? {from: Math.min(q.from, a), to: Math.max(q.to, b)} : {from: a, to: b};
  }
  scheduleDraw();
}});
// zoom della carta: il foglio si ingrandisce e si ridisegna a una risoluzione più alta (fino a 300 pixel per pollice)
var zoom = 1;

function sheetStyle(c) { c.style.width = zoom > 1 ? (zoom * 100) + '%' : ''; }

  if (drawT) return;

    drawT = 0;
    var near = paperEl.scrollHeight - paperEl.scrollTop - paperEl.clientHeight < 140;
    var bl = paperEl.querySelector('.blank'); if (bl) bl.remove();
    Object.keys(drawQ).forEach(function (k) {
      var n = +k;
      while (canvases.length <= n) { var c = document.createElement('canvas'); c.className = 'sheet'; sheetStyle(c); paperEl.appendChild(c); canvases.push(c); }
      RF.drawPrinterPage(canvases[n], mps, n, ppi(), {greenbar: $('rfstBar').checked}, drawQ[k]);
    });
    drawQ = {};
    renderSub();
    // segue la testina: scorre fino all'ultima riga stampata (se non stai guardando più in alto)
    if (near || mps.pageCount() <= 1) {
      var y = (mps.y / mps.H) % 1, last = canvases[Math.floor(mps.y / mps.H)] || canvases[canvases.length - 1];
      if (last) paperEl.scrollTop = Math.max(0, last.offsetTop + last.offsetHeight * y - paperEl.clientHeight * 0.7);
    }
  }, 60);
}

// la stampante vista dal firmware: passa tutto all'emulatore e tiene il conto dei byte per la riga di stato
var c64Printer = {
  listen: function (sec) { mps.listen(sec); if ((sec & 0xF0) === 0x60 && !st.c64) st.c64 = {n: 0, t0: Date.now(), last: 0}; },
  write: function (data) {
    mps.write(data); blink();
    var j = st.c64 || (st.c64 = {n: 0, t0: Date.now(), last: 0});
    j.n += data.length;
    var now = Date.now();
    if (now - j.last > 300) {
      j.last = now;
      var R = mps.raster, txt = tr('c64PrintNow', {n: nfmt(j.n), v: rate(j.n * 1000 / Math.max(1, now - j.t0))});
      if (R) txt += ' · ' + tr('rasterNow', {r: R.r, h: R.h, p: Math.round(R.r / R.h * 100)});
      renderFlag(txt);
    }
    clearTimeout(j.timer);
    // fine del lavoro: dopo un secondo senza dati
    j.timer = setTimeout(function () { if (st.c64 !== j) return; st.c64 = null; st.last = tr('c64Print', {n: nfmt(j.n)}); log('c64', st.last); renderFlag(); }, 1000);
  },
  unlisten: function () { mps.unlisten(); },
  reset: function () { mps.reset(); log('c64', 'reset'); }

async function connectEmu(port) {

  await disconnect();

  await host.hello();

  if (fwNew && ver !== fwNew) toast(tr('emuOld', {v: ver, n: fwNew}), true);

  $('rfstEmuOff').hidden = false; $('rfstEmuAgain').hidden = true; rfBtn('rfstEmuGo', true);
  renderFlag();
}

// manda i byte alla stampante vera a pezzi, con avanzamento e "Interrompi"
async function printReal(bytes, sa) {
  if (!st.usb) { toast(tr('noUsb'), true); return; }
  if (st.busy) { toast(tr('busy'), true); return; }
  var d = st.usb.drive; d.dev = dev();
  st.busy = true; updateButtons();
  $('rfstProg').hidden = false; $('rfstProgL').textContent = tr('printing', {d: d.dev});
  var bar = $('rfstProgBar').firstChild, t0 = Date.now(), sent = 0;
  try {
    await d.run(async function (c) {
      if (await c.listen(d.dev, sa)) { await c.unlisten(); throw new Error(tr('notPresent', {d: d.dev})); }
      for (var p = 0; p < bytes.length; p += 64) {
        if (c.abort) { await c.unlisten(); throw new Error(tr('aborted')); }
        var chunk = new Uint8Array(bytes.slice(p, p + 64)), n = await c.rawWrite(chunk);
        sent += n; blink();
        bar.style.width = (sent / bytes.length * 100).toFixed(1) + '%';
        $('rfstEta').textContent = tr('eta', {d: nfmt(sent), t: nfmt(bytes.length), r: rate(sent * 1000 / Math.max(1, Date.now() - t0))});
        if (n !== chunk.length) { await c.unlisten(); throw new Error(tr('notPresent', {d: d.dev})); }
      }
      await c.unlisten();
    });
    st.last = tr('printed', {n: nfmt(sent)}); log('info', st.last); toast(st.last);
  } catch (e) {
    toast(e.noBus ? tr('noBus') : e.aborted ? tr('aborted') : (e.message || String(e)), true);

  }
}
// pulsante RFIEC: arancione, piu' chiaro con la scritta "collegata" quando la scheda e' collegata
function rfBtn(id, on) { var b = $(id); b.hidden = false; b.classList.toggle('on', !!on); b.disabled = !!on || !RF.SerialLink.supported(); }
async function disconnect() {
  if (st.emu) { var e = st.emu; st.emu = null; try { await e.link.close(); } catch (x) {} log('info', 'RFIEC scollegata'); }
  if (st.usb) { var u = st.usb; st.usb = null; try { await u.xum.close(); } catch (x) {} log('info', 'xum1541 scollegata'); }
  $('rfstEmuOff').hidden = $('rfstUsbOff').hidden = true; $('rfstUsbGo').hidden = false; rfBtn('rfstEmuGo', false); rfBtn('rfstSerGo', false);
  st.last = ''; renderFlag();
}

/* ---------- cosa stampare: testo, immagine, file ---------- */
var tab = 'text';
function showTab(t) {
  tab = t;
  root.querySelectorAll('#rfstSendP .tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === t ? 'true' : 'false'); });
  $('rfstPText').hidden = t !== 'text'; $('rfstPImg').hidden = t !== 'img'; $('rfstPFile').hidden = t !== 'file'; $('rfstPLog').hidden = t !== 'log';
  $('rfstSendBar').hidden = t === 'log';
}
// {bytes, sa} da mandare, a seconda della scheda aperta
function job() {
  if (tab === 'text') {
    var txt = $('rfstText').value;
    if (!txt.trim()) return null;
    var sa = +$('rfstCase').value, dbl = $('rfstDbl').checked;
    if (mps.model !== 'mps') { var a = RF.textToAscii(txt, dbl ? 40 : 80); return {bytes: (dbl ? [27, 87, 1] : []).concat(a, dbl ? [27, 87, 0] : [], [13, 10]), sa: sa}; }
    var b = RF.textToPet(txt, sa === 7, dbl ? 40 : 80);
    if (dbl) b = [14].concat(b, [15]);
    return {bytes: b.concat([13]), sa: sa};
  }
  if (tab === 'img') {
    if (!st.img) return null;
    var data = imgData(), o = {threshold: +$('rfstImgThr').value, dither: $('rfstImgDith').checked};
    return {bytes: mps.model === 'mps' ? RF.imageToBits(data, o).concat([13]) : RF.imageToEsc(data, mps.model, o), sa: 0};
  }
  if (tab === 'file') {
    if (!st.file) return null;
    var f = st.file;
    if (f.kind === 'txt') {
      var t = new TextDecoder().decode(f.bytes);
      return {bytes: mps.model === 'mps' ? RF.textToPet(t, +$('rfstCase').value === 7).concat([13]) : RF.textToAscii(t).concat([13, 10]), sa: +$('rfstCase').value};
    }
    return {bytes: Array.prototype.slice.call(f.bytes), sa: f.kind === 'seq' ? +$('rfstCase').value : 0};
  }
  return null;
}
function preview() {
  var j = job();
  if (!j) { toast(tr('noData'), true); return; }
  mps.print(j.bytes, j.sa);
}
async function send(j) {
  j = j || job();
  if (!j) { toast(tr('noData'), true); return; }
  if (!st.usb) { toast(tr('noUsb'), true); return; }
  mps.print(j.bytes, j.sa);             // la carta mostra anche quello che va sulla stampante vera
  await printReal(j.bytes, j.sa);
}
function loadImage(file) {
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function () { st.img = img; drawImgPrev(); };
  img.onerror = function () { toast(file.name + ': ?', true); };
  img.src = url;
}
var GFX = {mps: {line: 480, aspect: 72 / 60}, epson: {line: 960, aspect: 72 / 120}, nec: {line: 1440, aspect: 1}};
function imgData() {
  var g = GFX[mps.model];
  return RF.scaleImage(st.img, +$('rfstImgW').value / 480 * g.line, g.aspect, g.line);
}
function drawImgPrev() {
  if (!st.img) return;
  // anteprima piccola: i punti retinati, con le proporzioni giuste anche se i punti non sono quadrati
  var data = imgData(), ink = RF.ditherImage(data, {threshold: +$('rfstImgThr').value, dither: $('rfstImgDith').checked}), c = $('rfstImgPrev');
  c.width = data.width; c.height = data.height;
  var g = c.getContext('2d'), id = g.createImageData(c.width, c.height);
  for (var i = 0; i < ink.length; i++) { id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = ink[i] ? 30 : 250; id.data[i * 4 + 3] = 255; }
  g.putImageData(id, 0, 0);
  c.style.aspectRatio = data.width + ' / ' + (data.height / GFX[mps.model].aspect);
  c.hidden = false;
}
function loadFile(file) {
  file.arrayBuffer().then(function (ab) {
    var b = new Uint8Array(ab), ext = (file.name.split('.').pop() || '').toLowerCase();
    var kind = ext === 'prn' || ext === 'bin' ? 'prn' : ext === 'txt' ? 'txt' : 'seq';
    if (ext === 's00' && b.length > 26) b = b.slice(26);
    st.file = {name: file.name, bytes: b, kind: kind};
    $('rfstFileInfo').innerHTML = tr('fileInfo', {n: esc(file.name), b: nfmt(b.length), k: tr(kind === 'prn' ? 'kPrn' : kind === 'txt' ? 'kTxt' : 'kSeq')});
  });
}
function dropZone(el, onFile) {
  el.addEventListener('dragover', function (ev) { ev.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', function () { el.classList.remove('over'); });
  el.addEventListener('drop', function (ev) { ev.preventDefault(); el.classList.remove('over'); if (ev.dataTransfer.files[0]) onFile(ev.dataTransfer.files[0]); });
}

/* ---------- pagina di prova ---------- */
function demoArt(w, h) {
  var c = document.createElement('canvas'); c.width = 300; c.height = 84;
  var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 300, 84);
  x.fillStyle = '#000'; x.fillRect(4, 4, 70, 76); x.fillStyle = '#fff'; x.fillRect(18, 4, 40, 24); x.beginPath(); x.arc(39, 54, 12, 0, 7); x.fill();
  x.fillStyle = '#000'; x.fillRect(46, 8, 8, 16); x.beginPath(); x.arc(39, 54, 4, 0, 7); x.fill();
  x.strokeStyle = '#000'; x.lineWidth = 4; x.beginPath();
  for (var px = 90; px < 296; px++) { var py = 42 + Math.sin((px - 90) / 14) * 30 * Math.exp(-(px - 90) / 260); if (px === 90) x.moveTo(px, py); else x.lineTo(px, py); }
  x.stroke();
  if (!w) return x.getImageData(0, 0, 300, 84);
  var d = document.createElement('canvas'); d.width = w; d.height = h;
  var g = d.getContext('2d'); g.drawImage(c, 0, 0, w, h);
  return g.getImageData(0, 0, w, h);
}
function demoEsc(model) {
  var A = function (s) { return RF.textToAscii(s); }, out = [27, 64];
  out = out.concat([27, 87, 1], A('retrofixer.it'), [27, 87, 0, 13, 10]);
  out = out.concat(A('Stampante emulata: ' + modelName() + ' (comandi ESC/P)'), [13, 10, 13, 10]);
  out = out.concat([27, 69], A('Neretto'), [27, 70], A(' - '), [27, 45, 1], A('sottolineato'), [27, 45, 0], A(' - '), [15], A('condensato a 17 caratteri per pollice'), [18], [13, 10]);
  out = out.concat([27, 77], A('Elite, 12 caratteri per pollice.'), [27, 80], [13, 10, 13, 10]);
  // nastro a colori: una barra per colore (ESC r n), poi un passaggio sovrapposto
  for (var c = 0; c < 7; c++) { out = out.concat([27, 114, c, 27, 42, 1, 120, 0]); for (var k = 0; k < 120; k++) out.push(0xFF); }
  out = out.concat([27, 114, 0, 13, 10, 13, 10]);
  out = out.concat(A('Grafica a punti (ESC *):'), [13, 10]);
  var g = GFX[model], w = Math.round(300 / 480 * g.line);
  out = out.concat(RF.imageToEsc(demoArt(w, Math.round(84 / 72 * g.aspect * g.line / 8)), model, {dither: false}));
  out = out.concat(A('Fine della pagina di prova.'), [13, 10]);
  return out;
}
function demoPage() {
  if (mps.model !== 'mps') return demoEsc(mps.model);
  var P = function (s) { return RF.textToPet(s, false, 80); }, out = [];
  out = out.concat([14], P('RETROFIXER.IT'), [15, 13]);
  out = out.concat(P('STAMPANTE COMMODORE EMULATA - MPS-803'), [13]);
  var line = []; for (var i = 0; i < 80; i++) line.push(0x60); out = out.concat(line, [13, 13]);
  out = out.concat(P('10 REM LISTATO DI PROVA\n20 FOR I=1 TO 10\n30 PRINT "CIAO";I\n40 NEXT I\n50 OPEN4,4:CMD4:LIST'), [13]);
  out = out.concat([17], RF.textToPet('Maiuscole e minuscole con OPEN 4,4,7: Commodore 64', true), [145, 13]);
  out = out.concat([18], P(' INVERSO '), [146], P('  E DOPPIA LARGHEZZA: '), [14], P('MPS'), [15, 13, 13]);
  // simboli grafici PETSCII
  var g = []; for (var k = 0x60; k <= 0x7F; k++) g.push(k); for (k = 0xA0; k <= 0xBF; k++) g.push(k);
  out = out.concat(g, [13]);
  out = out.concat([0xB0, 0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0xAE, 13, 0x7D], P(' BOX! '), [0x60, 0x60, 0x7D, 13, 0xAD, 0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0xBD, 13, 13]);
  out = out.concat(P('GRAFICA A PUNTI (CHR$(8)):'), [13]);
  // disegno: un floppy e un'onda, colonna per colonna
  out = out.concat(RF.imageToBits(demoArt(), {dither: false, cols: 300}), [13]);
  out = out.concat(P('FINE DELLA PAGINA DI PROVA.'), [13]);
  return out;
}

/* ---------- firmware del Pro Micro (come nella pagina XUM1541) ---------- */
function toHex(bin) {
  var out = [];
  for (var a = 0; a < bin.length; a += 16) {
    var n = Math.min(16, bin.length - a), rec = [n, a >> 8, a & 255, 0], line = ':';
    for (var i = 0; i < n; i++) rec.push(bin[a + i]);
    var sum = rec.reduce(function (x, y) { return x + y; }, 0);
    rec.push((256 - (sum & 255)) & 255);
    rec.forEach(function (b) { line += b.toString(16).toUpperCase().padStart(2, '0'); });
    out.push(line);
  }
  out.push(':00000001FF');
  return out.join('\r\n') + '\r\n';
}
async function firmwareDlg() {
  if (!RF.SerialLink.supported()) { toast(tr('emuNoSerial'), true); return; }
  var keys = Object.keys(RF.FIRMWARE || {});
  var r = await ask({title: tr('fwT'), body: tr('fwB'), fields: [{id: 'f', label: tr('fwWhich'), value: st.mode === 'real' ? 'xum1541' : 'rfiec', options: keys.map(function (k) { return [k, RF.FIRMWARE[k].name]; })}],
    buttons: [{v: 'src', label: tr('fwSrc')}, {v: 'dl', label: tr('fwDl')}, {v: 'go', label: tr('fwGo'), cls: 'pri'}]});
  if (!r) return;
  var fw = RF.FIRMWARE[r.f], img = RF.firmwareImage(r.f);
  if (r._b === 'dl') { saveBytes(fw.file, new TextEncoder().encode(toHex(img))); return; }
  if (r._b === 'src') { Object.keys(RF.FIRMWARE_SRC || {}).forEach(function (n, i) { setTimeout(function () { saveBytes(n, new TextEncoder().encode(RF.FIRMWARE_SRC[n])); }, i * 400); }); return; }
  var sport = st.emu ? st.emu.port : st.usb && st.usb.xum.isSerial ? st.usb.xum.link.port : null;
  var auto = !!sport, port = sport;
  await disconnect();
  if (auto) { try { await RF.SerialLink.touch1200(port); } catch (e) { log('err', e.message); auto = false; } }
  await ask({title: tr('fwT'), body: auto ? tr('fwBootAuto') : tr('fwBootManual'), ok: tr('fwPick'), cancel: tr('close'),
    onSubmit: async function (v, out) {
      var link = null;
      try {
        var bp = await navigator.serial.requestPort({});
        link = new RF.SerialLink(bp, log);
        await link.open(57600);
        await new RF.Avr109(link, log).program(img, function (d, t, ph) { out.textContent = tr(ph === 'write' ? 'fwWriting' : 'fwVerify') + ' ' + Math.round(d / t * 100) + '%'; out.className = 'out'; });
        await link.close();
        out.textContent = tr('fwDone', {n: fw.name}); out.className = 'out';
        log('info', fw.name + ' installato');
      } catch (e) {
        if (link) { try { await link.close(); } catch (x) {} }
        out.textContent = e.message || String(e); out.className = 'out err';
      }
    }});
}

/* ---------- collegamenti dei pulsanti ---------- */
function wire() {
  root.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = tr(el.dataset.t); });
  root.querySelectorAll('[data-th]').forEach(function (el) { el.innerHTML = tr(el.dataset.th); });
  root.querySelectorAll('.modes button').forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.m); }); });
  root.querySelectorAll('#rfstSendP .tabs button').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });
  $('rfstText').placeholder = tr('textPh'); $('rfstText').value = tr('textDemo');
  $('rfstEmuGo').onclick = function () { connectEmu(null); };
  $('rfstEmuAgain').onclick = function () { connectEmu(st.lastSerial); };
  $('rfstEmuOff').onclick = function () { disconnect(); $('rfstEmuNote').innerHTML = tr('emuIdle'); if (st.lastSerial) $('rfstEmuAgain').hidden = false; };
  $('rfstUsbGo').onclick = function () { connectUsb(null); };
  $('rfstSerGo').onclick = function () { connectSerial(null); };
  $('rfstUsbAgain').onclick = function () { connectUsb(st.knownUsb); };
  $('rfstUsbOff').onclick = function () { disconnect(); $('rfstUsbNote').innerHTML = tr('usbIdle'); if (st.knownUsb) $('rfstUsbAgain').hidden = false; };
  $('rfstFw1').onclick = $('rfstFw2').onclick = firmwareDlg;
  $('rfstDemo').onclick = function () { mps.print(demoPage(), 0); st.last = modelName() + ': ' + (EN ? 'test page' : 'pagina di prova'); renderFlag(); };
  $('rfstModel').value = mps.model;
  $('rfstModel').onchange = function () {
    var m = this.value;
    try { localStorage.setItem('rfstModel', m); } catch (e) {}
    mps.setModel(m);
    toast(tr('modelChanged', {m: modelName()}));
    renderFlag(); drawImgPrev();
  };
  $('rfstDev').onchange = function () { if (st.emu) st.emu.host.printerDev = dev(); renderFlag(); if (st.usb) probe(); };
  $('rfstPdf').onclick = function () {
    if (!mps.pageCount()) { toast(tr('nothing'), true); return; }
    saveBytes(tr('pdfName'), RF.printerPdf(mps, {greenbar: $('rfstBar').checked, title: 'RetroFixer MPS'}), 'application/pdf');
  };
  $('rfstPrn').onclick = function () { if (mps.pageCount()) saveBytes(tr('prnName'), mps.rawBytes()); };
  $('rfstReprint').onclick = function () { printReal(Array.prototype.slice.call(mps.rawBytes()), 0); };
  $('rfstClear').onclick = function () { mps.clear(); toast(tr('cleared')); };
  $('rfstBar').onchange = redrawAll;
  $('rfstZoom').onchange = function () {
    // tiene al centro lo stesso punto della carta
    var fy = (paperEl.scrollTop + paperEl.clientHeight / 2) / Math.max(1, paperEl.scrollHeight), fx = (paperEl.scrollLeft + paperEl.clientWidth / 2) / Math.max(1, paperEl.scrollWidth);
    zoom = +this.value;
    paperEl.classList.toggle('zoomed', zoom > 1);
    paperEl.querySelectorAll('canvas').forEach(sheetStyle);
    if (!mps.pageCount()) { paperEl.innerHTML = ''; blankSheet(); }
    else redrawAll();
    setTimeout(function () {
      paperEl.scrollTop = fy * paperEl.scrollHeight - paperEl.clientHeight / 2;
      paperEl.scrollLeft = fx * paperEl.scrollWidth - paperEl.clientWidth / 2;
    }, 120);
  };
  $('rfstPreview').onclick = preview;
  $('rfstSend').onclick = function () { send(); };
  $('rfstStop').onclick = function () { if (st.usb) st.usb.cbm.stop(); };
  $('rfstLogClr').onclick = function () { logEl.innerHTML = ''; };
  $('rfstImgPick').onclick = function () { $('rfstImgInp').click(); };
  $('rfstImgInp').onchange = function () { if (this.files[0]) loadImage(this.files[0]); this.value = ''; };
  ['rfstImgW', 'rfstImgThr', 'rfstImgDith'].forEach(function (id) { $(id).addEventListener('input', drawImgPrev); });
  dropZone($('rfstImgDrop'), loadImage);
  $('rfstFilePick').onclick = function () { $('rfstFileInp').click(); };
  $('rfstFileInp').onchange = function () { if (this.files[0]) loadFile(this.files[0]); this.value = ''; };
  dropZone($('rfstFileDrop'), loadFile);
  $('rfstEmuNote').innerHTML = RF.SerialLink.supported() ? tr('emuIdle') : tr('emuNoSerial');
  $('rfstUsbNote').innerHTML = RF.Xum1541.supported() ? tr('usbIdle') : tr(RF.SerialLink.supported() ? 'usbNoSer' : 'usbNo');
  // Firefox e Safari non hanno WebUSB né Web Serial: pulsanti spenti come sulla pagina XUM1541
  if (!RF.Xum1541.supported()) $('rfstUsbGo').disabled = true;
  if (!RF.SerialLink.supported()) $('rfstEmuGo').disabled = $('rfstSerGo').disabled = true;
  if (navigator.serial) {
    navigator.serial.addEventListener('disconnect', function (ev) {
      if ((st.emu && st.emu.port === ev.target) || (st.usb && st.usb.xum.isSerial && st.usb.xum.link.port === ev.target)) { toast(tr('emuLost'), true); st.busy = false; disconnect(); }
    });
    navigator.serial.getPorts().then(function (l) { if (l.length) { st.lastSerial = l[0]; $('rfstEmuAgain').hidden = false; } });
  }
  if (navigator.usb) {
    navigator.usb.addEventListener('disconnect', function (ev) { if (st.usb && st.usb.xum.dev === ev.device) { toast(tr('usbLost'), true); st.busy = false; disconnect(); } });
    RF.Xum1541.known().then(function (l) { if (l.length) { st.knownUsb = l[0]; $('rfstUsbAgain').hidden = false; } });
  }
  var m0 = 'demo';
  try { m0 = localStorage.getItem('rfstMode') || 'demo'; } catch (e) {}
  setMode(m0);
  renderSub();
  showTab('text');
}
wire();
RF.printerUi = {mps: mps, st: st, demoPage: demoPage};
})(window.RFFloppy = window.RFFloppy || {});
</script>
